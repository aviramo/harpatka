<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>לוח השיתופים | יוצאים להרפתקה</title>
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#F6EFE4" />
  <link rel="icon" href="../images/favicon-v4.ico" sizes="any" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700&family=Rubik:wght@500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root { --cream: #F6EFE4; --sand: #E8D5BE; --terra: #C96F52; --olive: #686A48; --ink: #3F382F; --paper: #FFFDF9; --line: #E8D5BE; --muted: #7A6F60; --heart: #D2504B; }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body { background: var(--cream); color: var(--ink); font-family: "Assistant", system-ui, sans-serif; font-size: 17px; line-height: 1.45; -webkit-tap-highlight-color: transparent; }
    button, input, textarea { font: inherit; color: inherit; }
    button { cursor: pointer; border: 0; background: none; padding: 0; }
    :focus-visible { outline: 3px solid #663F4C; outline-offset: 2px; }
    .wrap { max-width: 640px; margin: 0 auto; padding: 18px 16px 60px; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    h1 { font-family: "Rubik", sans-serif; font-size: 26px; margin: 0; }
    .sub { color: var(--muted); font-size: 15px; margin: 4px 0 0; }
    .out { font-size: 14px; color: var(--muted); text-decoration: underline; }
    .banner { margin-top: 14px; padding: 11px 14px; border-radius: 14px; background: #FBE9C7; color: #7A5410; font-size: 15px; font-weight: 600; }
    .banner[hidden] { display: none; }
    .card { background: var(--paper); border-radius: 20px; box-shadow: 0 0 0 1px rgba(232,213,190,.7); padding: 14px; }
    .composer { margin-top: 16px; }
    textarea { width: 100%; min-height: 84px; resize: vertical; border: 0; background: transparent; font-size: 17px; line-height: 1.45; padding: 2px; }
    textarea:focus-visible { outline: none; }
    .crow { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 6px; }
    .cnt { font-size: 13px; color: var(--muted); }
    .btn { background: var(--terra); color: #fff; font-weight: 700; padding: 10px 22px; border-radius: 999px; font-size: 16px; }
    .btn:disabled { opacity: .5; }
    .btn.ghost { background: var(--sand); color: var(--ink); }
    .post { margin-top: 12px; }
    .body { white-space: pre-wrap; word-wrap: break-word; overflow-wrap: anywhere; }
    .meta { display: flex; align-items: center; flex-wrap: wrap; gap: 4px 14px; margin-top: 8px; font-size: 14px; color: var(--muted); }
    .act { display: inline-flex; align-items: center; gap: 5px; color: var(--muted); font-weight: 600; font-size: 14px; padding: 4px 2px; }
    .act svg { width: 19px; height: 19px; }
    .act.liked { color: var(--heart); }
    .act.liked svg { fill: var(--heart); stroke: var(--heart); }
    .act.del { color: #A3453A; }
    .pend { display: inline-block; font-size: 12.5px; font-weight: 700; background: #FBE9C7; color: #7A5410; padding: 2px 9px; border-radius: 999px; }
    .kids { margin-top: 10px; padding-right: 14px; border-right: 2px solid var(--sand); }
    .kids .kids { margin-top: 8px; }
    .flat .kids { padding-right: 0; border-right: 0; }
    .cm { margin-top: 10px; }
    .cm .body { font-size: 16px; }
    .reply { margin-top: 10px; background: var(--cream); border-radius: 14px; padding: 8px 10px; }
    .reply textarea { min-height: 56px; }
    .empty { text-align: center; color: var(--muted); padding: 30px 10px; }
    dialog { border: 0; border-radius: 24px; padding: 20px; width: min(420px, calc(100vw - 32px)); background: var(--paper); color: var(--ink); box-shadow: 0 20px 60px rgba(63,56,47,.3); }
    dialog::backdrop { background: rgba(63,56,47,.5); }
    dialog h2 { font-family: "Rubik", sans-serif; font-size: 20px; margin: 0 0 6px; }
    dialog p { margin: 0 0 12px; color: var(--muted); font-size: 15px; }
    dialog input { width: 100%; border: 1.5px solid var(--line); border-radius: 14px; padding: 11px 14px; font-size: 17px; background: #fff; direction: ltr; text-align: right; }
    .err { color: #A3453A; font-size: 14px; min-height: 20px; margin-top: 6px; }
    .drow { display: flex; gap: 8px; margin-top: 10px; }
    .drow .btn { flex: 1; }
    .gbtn { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; background: #fff; border-radius: 999px; padding: 12px; font-weight: 700; box-shadow: 0 0 0 1.5px var(--line); }
    .gbtn svg { width: 20px; height: 20px; }
    .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(20px); background: var(--ink); color: var(--paper); padding: 10px 16px; border-radius: 14px; font-weight: 600; opacity: 0; pointer-events: none; transition: .2s; z-index: 50; max-width: calc(100% - 32px); }
    .toast.on { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div>
        <h1>לוח השיתופים</h1>
        <p class="sub">מקום לשתף ולעזור אחד לשני, בלי שמות</p>
      </div>
      <button type="button" class="out" id="out" hidden>יציאה</button>
    </header>

    <div class="banner" id="banner" hidden></div>

    <div class="card composer">
      <textarea id="newText" maxlength="2000" placeholder="אפשר לשתף כאן כל דבר: טרמפ למפגש, המלצה, שאלה או מחשבה. כל מי שנכנס לאתר יראה את זה, בלי שם" aria-label="פוסט חדש"></textarea>
      <div class="crow"><span class="cnt" id="newCnt"></span><button type="button" class="btn" id="newBtn">פרסום</button></div>
    </div>

    <div id="feed"></div>
  </div>

  <dialog id="phoneDlg" aria-labelledby="phoneTitle">
    <h2 id="phoneTitle">עוד רגע ומפרסמים</h2>
    <p>כדי לפרסם צריך לאמת שאתם משתתפים. הזינו את הטלפון שנרשמתם איתו. החיבור ייבדק ויאושר על ידינו, ובינתיים מה שתכתבו יהיה גלוי רק לכם</p>
    <input id="phoneIn" type="tel" inputmode="tel" autocomplete="tel" placeholder="050-0000000" aria-label="טלפון" />
    <div class="err" id="phoneErr" role="alert"></div>
    <div class="drow"><button type="button" class="btn" id="phoneOk">המשך</button><button type="button" class="btn ghost" id="phoneCancel">ביטול</button></div>
  </dialog>

  <dialog id="loginDlg" aria-labelledby="loginTitle">
    <h2 id="loginTitle">כניסה</h2>
    <p>כדי לפרסם, להגיב או לסמן לב צריך להתחבר. מה שתכתבו יוצג בלי שם</p>
    <button type="button" class="gbtn" id="gBtn">
      <svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.1H42V20H24v8h11.3C33.7 32.7 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 8 3l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.6-.4-3.9z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 8 3l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.3 0-9.7-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.1H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.6-.4-3.9z"/></svg>
      כניסה עם גוגל
    </button>
    <div class="drow"><button type="button" class="btn ghost" id="loginCancel">ביטול</button></div>
  </dialog>

  <div class="toast" id="toast" role="status"></div>

  <script>
  const DB = {
    url: 'https://ezakarwqstnldqixgreb.supabase.co',
    key: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV6YWthcndxc3RubGRxaXhncmViIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEyMTA3MzIsImV4cCI6MjEwNjc4NjczMn0.Bg0eFBC4zKjyJc5kBw3wLgSP-PkxLFVv3o7-4YUdq4c',
  };
  const $ = (s) => document.querySelector(s);
  const SKEY = 'harpatka_board_session', PKEY = 'harpatka_board_pending';
  const LIKE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20.5s-7.5-4.6-9.2-9.4C1.7 7.700 3.900 4.500 7.200 4.500c2 0 3.700 1.100 4.800 2.800 1.100-1.700 2.800-2.800 4.800-2.800 3.300 0 5.500 3.200 4.400 6.600-1.700 4.800-9.200 9.400-9.200 9.400z"/></svg>';
  let session = null, me = null, posts = [], pendingAct = null, openReply = null, delAsk = null;

  /* ---------- כניסה עם גוגל (הזדהות של Supabase, בלי SDK) ---------- */
  const jwtData = (tok) => { try { return JSON.parse(decodeURIComponent(escape(atob(tok.split('.')[1].replace(/-/g, '+').replace(/_/g, '/'))))); } catch (e) { return {}; } };
  const saveSession = (s) => { session = s; try { localStorage.setItem(SKEY, JSON.stringify(s)); } catch (e) {} };
  const clearSession = () => { session = null; me = null; try { localStorage.removeItem(SKEY); } catch (e) {} };
  const sessionOk = (s) => s && s.access_token && (jwtData(s.access_token).exp || 0) * 1000 > Date.now() + 30000;
  async function refreshSession() {
    if (!session || !session.refresh_token) return false;
    try {
      const r = await fetch(DB.url + '/auth/v1/token?grant_type=refresh_token', { method: 'POST', headers: { apikey: DB.key, 'Content-Type': 'application/json' }, body: JSON.stringify({ refresh_token: session.refresh_token }) });
      if (!r.ok) return false;
      const d = await r.json(); saveSession({ access_token: d.access_token, refresh_token: d.refresh_token }); return true;
    } catch (e) { return false; }
  }
  const goGoogle = () => { location.href = DB.url + '/auth/v1/authorize?provider=google&redirect_to=' + encodeURIComponent(location.origin + location.pathname); };
  async function startAuth() {
    const h = new URLSearchParams(location.hash.replace(/^#/, ''));
    if (h.get('access_token')) { saveSession({ access_token: h.get('access_token'), refresh_token: h.get('refresh_token') }); history.replaceState(null, '', location.pathname + location.search); }
    else if (h.get('error_description')) { history.replaceState(null, '', location.pathname + location.search); toast('הכניסה נכשלה'); }
    else { try { session = JSON.parse(localStorage.getItem(SKEY) || 'null'); } catch (e) { session = null; } }
    if (session && !sessionOk(session) && !(await refreshSession())) clearSession();
  }

  async function rpc(name, body) {
    const call = () => fetch(DB.url + '/rest/v1/rpc/' + name, { method: 'POST', headers: { apikey: DB.key, Authorization: 'Bearer ' + ((session && session.access_token) || DB.key), 'Content-Type': 'application/json' }, body: JSON.stringify(body || {}) });
    let res = await call();
    if (res.status === 401 && session && await refreshSession()) res = await call();
    if (res.status === 401 || res.status === 403) { clearSession(); throw new Error('auth'); }
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const t = await res.text(); return t ? JSON.parse(t) : null;
  }

  let toastT = 0;
  function toast(m) { const t = $('#toast'); t.textContent = m; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 2600); }
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  function ago(iso) {
    const s = Math.max(0, (Date.now() - new Date(iso).getTime()) / 1000);
    if (s < 60) return 'עכשיו';
    if (s < 3600) return 'לפני ' + Math.floor(s / 60) + ' דקות';
    if (s < 86400) return 'לפני ' + Math.floor(s / 3600) + ' שעות';
    return new Date(iso).toLocaleDateString('he-IL', { day: 'numeric', month: 'numeric', timeZone: 'Asia/Jerusalem' });
  }

  /* ---------- רינדור: עץ של פוסטים ותגובות (טקסט בלבד, textContent דרך esc) ---------- */
  function render() {
    const kids = {}; posts.forEach((p) => { (kids[p.parent_id || 'root'] = kids[p.parent_id || 'root'] || []).push(p); });
    const roots = (kids.root || []).slice().sort((a, b) => b.created_at.localeCompare(a.created_at));
    const node = (p, depth) => {
      const ch = (kids[p.id] || []).slice().sort((a, b) => a.created_at.localeCompare(b.created_at));
      const asking = delAsk === p.id;
      const act = '<span class="meta">'
        + '<span>' + ago(p.created_at) + '</span>'
        + '<button type="button" class="act' + (p.liked ? ' liked' : '') + '" data-like="' + p.id + '" aria-pressed="' + p.liked + '" aria-label="לב">' + LIKE + '<span>' + (p.likes || '') + '</span></button>'
        + '<button type="button" class="act" data-reply="' + p.id + '">תגובה</button>'
        + (p.can_delete ? (asking ? '<span>למחוק? <button type="button" class="act del" data-delyes="' + p.id + '">כן</button> <button type="button" class="act" data-delno="1">לא</button></span>' : '<button type="button" class="act del" data-del="' + p.id + '">מחיקה</button>') : '')
        + (p.pending ? '<span class="pend">ממתין לאישור, רק אתם רואים</span>' : '') + '</span>';
      const reply = openReply === p.id ? '<div class="reply"><textarea maxlength="2000" data-rtext="' + p.id + '" placeholder="תגובה" aria-label="תגובה"></textarea><div class="crow"><span></span><button type="button" class="btn" data-rsend="' + p.id + '">שליחה</button></div></div>' : '';
      return '<div class="' + (depth ? 'cm' : 'card post') + '"><div class="body">' + esc(p.body) + '</div>' + act + reply
        + (ch.length ? '<div class="kids' + (depth >= 3 ? ' flat' : '') + '">' + ch.map((c) => node(c, depth + 1)).join('') + '</div>' : '') + '</div>';
    };
    $('#feed').innerHTML = roots.length ? roots.map((p) => node(p, 0)).join('') : '<div class="empty">עוד אין פוסטים. אפשר להיות הראשונים</div>';
    if (openReply) { const t = $('[data-rtext="' + openReply + '"]'); if (t && !t.dataset.f) { t.dataset.f = 1; t.focus(); } }
    const b = $('#banner');
    if (me === 'pending') { b.textContent = 'החשבון שלכם ממתין לאישור. עד אז מה שכתבתם גלוי רק לכם'; b.hidden = false; }
    else if (me === 'blocked') { b.textContent = 'אין אפשרות לפרסם בחשבון הזה'; b.hidden = false; }
    else b.hidden = true;
    $('#out').hidden = !session;
  }

  async function load() {
    try {
      const [feed, st] = await Promise.all([rpc('harpatka_board_feed'), session ? rpc('harpatka_board_me') : Promise.resolve(null)]);
      posts = feed || []; me = st;
    } catch (e) { if (e.message === 'auth') { /* נכנס מחדש כמבקר */ } }
    render();
  }
  const keepTyping = () => { const a = document.activeElement; return a && a.tagName === 'TEXTAREA' && a.value; };

  /* ---------- פעולות ---------- */
  async function submit(body, parent) {
    body = (body || '').trim(); if (!body) return false;
    if (!session) { try { sessionStorage.setItem(PKEY, JSON.stringify({ body, parent })); } catch (e) {} $('#loginDlg').showModal(); return false; }
    if (!me) { pendingAct = { body, parent }; $('#phoneErr').textContent = ''; $('#phoneDlg').showModal(); $('#phoneIn').focus(); return false; }
    try {
      const r = await rpc('harpatka_board_post', { p_body: body, p_parent: parent || null });
      if (r === 'ok') { toast(me === 'approved' ? 'פורסם' : 'נשמר, יופיע לכולם אחרי האישור'); await load(); return true; }
      toast({ blocked: 'אין אפשרות לפרסם', limit: 'אפשר לפרסם עוד אחרי האישור', long: 'הטקסט ארוך מדי', no_parent: 'הפוסט כבר לא קיים' }[r] || 'משהו השתבש');
    } catch (e) { toast('משהו השתבש, אפשר לנסות שוב'); }
    return false;
  }
  $('#newBtn').addEventListener('click', async () => { if (await submit($('#newText').value, null)) $('#newText').value = ''; $('#newCnt').textContent = ''; });
  $('#newText').addEventListener('input', (e) => { const n = e.target.value.length; $('#newCnt').textContent = n > 1700 ? n + ' / 2000' : ''; });

  $('#feed').addEventListener('click', async (e) => {
    const t = e.target.closest('button'); if (!t) return;
    if (t.dataset.reply) { openReply = openReply === t.dataset.reply ? null : t.dataset.reply; render(); return; }
    if (t.dataset.rsend) {
      const ta = $('[data-rtext="' + t.dataset.rsend + '"]');
      if (await submit(ta.value, t.dataset.rsend)) openReply = null; render(); return;
    }
    if (t.dataset.like) {
      if (!session || !me || me === 'blocked') { if (!session) $('#loginDlg').showModal(); else toast(me ? 'אין אפשרות' : 'צריך קודם לאמת טלפון בפרסום ראשון'); return; }
      const p = posts.find((x) => x.id === t.dataset.like); if (!p) return;
      p.liked = !p.liked; p.likes = Math.max(0, (p.likes || 0) + (p.liked ? 1 : -1)); render();
      try { await rpc('harpatka_board_like', { p_id: p.id }); } catch (err) { p.liked = !p.liked; p.likes += p.liked ? 1 : -1; render(); }
      return;
    }
    if (t.dataset.del) { delAsk = t.dataset.del; render(); return; }
    if (t.dataset.delno) { delAsk = null; render(); return; }
    if (t.dataset.delyes) {
      delAsk = null;
      try { await rpc('harpatka_board_delete', { p_id: t.dataset.delyes }); toast('נמחק'); } catch (err) { toast('משהו השתבש'); }
      load();
    }
  });

  $('#gBtn').addEventListener('click', goGoogle);
  $('#loginCancel').addEventListener('click', () => $('#loginDlg').close());
  $('#phoneCancel').addEventListener('click', () => { pendingAct = null; $('#phoneDlg').close(); });
  async function claim() {
    const v = $('#phoneIn').value.trim(); if (v.replace(/\D/g, '').length < 8) { $('#phoneErr').textContent = 'מספר לא תקין'; return; }
    $('#phoneOk').disabled = true;
    try {
      const r = await rpc('harpatka_board_claim', { p_phone: v });
      if (r === 'invalid_phone') { $('#phoneErr').textContent = 'מספר לא תקין'; return; }
      me = r; $('#phoneDlg').close();
      const a = pendingAct; pendingAct = null; if (a) { if (await submit(a.body, a.parent)) { $('#newText').value = ''; openReply = null; } }
      load();
    } catch (e) { $('#phoneErr').textContent = 'משהו השתבש, אפשר לנסות שוב'; }
    finally { $('#phoneOk').disabled = false; }
  }
  $('#phoneOk').addEventListener('click', claim);
  $('#phoneIn').addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); claim(); } });
  $('#out').addEventListener('click', () => { clearSession(); location.reload(); });
  document.addEventListener('visibilitychange', () => { if (!document.hidden && !keepTyping()) load(); });
  setInterval(() => { if (!document.hidden && !keepTyping() && !document.querySelector('dialog[open]')) load(); }, 60000);

  (async () => {
    await startAuth();
    await load();
    /* חזרה מהכניסה: ממשיכים מה שהתחילו לכתוב */
    let p = null; try { p = JSON.parse(sessionStorage.getItem(PKEY) || 'null'); sessionStorage.removeItem(PKEY); } catch (e) {}
    if (p && session) { if (!p.parent) $('#newText').value = p.body; if (await submit(p.body, p.parent) && !p.parent) $('#newText').value = ''; }
  })();
  </script>
</body>
</html>
