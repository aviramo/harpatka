<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>שיחה | יוצאים להרפתקה</title>
  <meta name="theme-color" content="#064452" />
  <!-- הבוט עבר לפלואה. הקישורים הישנים של המודעות (/chat/?c=...) מנותבים לכתובת החדשה: c הופך ל-pain, שאר הפרמטרים נשמרים. -->
  <script>
    (function () {
      var q = new URLSearchParams(location.search), out = new URLSearchParams();
      q.forEach(function (v, k) { out.append(k === 'c' ? 'pain' : k, v); });
      var s = out.toString();
      location.replace('https://chatbot.floa.co.il/harpatka' + (s ? '?' + s : '') + location.hash);
    })();
  </script>
  <noscript><meta http-equiv="refresh" content="0; url=https://chatbot.floa.co.il/harpatka" /></noscript>
</head>
<body>
  <p style="font:18px Assistant,Arial,sans-serif;text-align:center;margin:3rem 1rem">עוברים לשיחה… <a href="https://chatbot.floa.co.il/harpatka">לחצו כאן אם לא עברתם</a></p>
</body>
</html>
