<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <title>משתתפים · יוצאים להרפתקה</title>
  <link rel="icon" href="../favicon.ico" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700&family=Rubik:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --cream: #F6EFE4; --sand: #E8D5BE; --terra: #C96F52; --coral: #D98B70;
      --sage: #9A9A75; --olive: #686A48; --plum: #663F4C; --ink: #3F382F;
      --paper: #FFFDF9; --muted: #8A7F72; --line: #EADFCF;
      --green: #25A55F; --green-bg: #E3F4E9; --red: #C2543A; --red-bg: #FBE6DF;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      background: var(--cream); color: var(--ink);
      font-family: "Assistant", system-ui, sans-serif; font-size: 17px; line-height: 1.4;
      -webkit-tap-highlight-color: transparent;
    }
    button, input, textarea { font: inherit; color: inherit; }
    button { cursor: pointer; border: 0; background: none; padding: 0; }
    :focus-visible { outline: 3px solid var(--plum); outline-offset: 2px; }

    .wrap { max-width: 1120px; margin: 0 auto; padding: 0 16px 120px; }

    header.top {
      position: sticky; top: 0; z-index: 5; background: var(--cream);
      padding: 16px 0 10px; margin: 0 -16px; padding-inline: 16px;
    }
    .title-row { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
    h1 { font-family: "Rubik", sans-serif; font-size: 26px; margin: 0; }
    .brand { color: var(--muted); font-size: 14px; }

    .search { display: block; margin-top: 12px; position: relative; }
    .search input {
      width: 100%; height: 48px; border-radius: 16px; border: 1.5px solid var(--line);
      background: var(--paper); padding: 0 44px 0 14px; font-size: 17px;
    }
    .search input:focus { border-color: var(--terra); outline: none; }
    .search svg { position: absolute; right: 14px; top: 14px; width: 20px; height: 20px; color: var(--muted); }

    .chips {
      display: flex; gap: 8px; overflow-x: auto; padding: 12px 16px 4px; margin: 0 -16px;
      scrollbar-width: none;
    }
    .chips::-webkit-scrollbar { display: none; }
    .chip {
      flex: 0 0 auto; display: inline-flex; align-items: center; gap: 8px;
      height: 40px; padding: 0 14px; border-radius: 999px;
      background: var(--paper); border: 1.5px solid var(--line); font-weight: 600; white-space: nowrap;
    }
    .chip .count { font-weight: 600; color: var(--muted); font-size: 14px; }
    .chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--paper); }
    .chip[aria-pressed="true"] .count { color: var(--sand); }
    .chip.past:not([aria-pressed="true"]) { opacity: .6; }
    .chip.add { border-style: dashed; color: var(--terra); border-color: var(--coral); background: transparent; }

    .meeting-bar {
      display: none; align-items: center; justify-content: space-between; gap: 12px;
      margin-top: 10px; padding: 10px 14px; border-radius: 16px; background: var(--sand);
      font-size: 15px;
    }
    .meeting-bar.show { display: flex; }
    .meeting-bar b { font-family: "Rubik", sans-serif; font-weight: 600; }
    .link-btn { color: var(--plum); font-weight: 700; text-decoration: underline; text-underline-offset: 3px; }

    .list { list-style: none; margin: 10px 0 0; padding: 0; display: grid; gap: 10px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
    @media (min-width: 760px) { .list { grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; } }
    .list .empty, .list .group { grid-column: 1 / -1; }
    .list .group { color: var(--muted); font-weight: 700; font-size: 14px; padding: 6px 4px 0; }
    .list .group.newp { padding: 0; }
    .row.other { background: transparent; box-shadow: none; border: 1.5px dashed var(--coral); }
    .head-acts { display: flex; gap: 8px; margin-inline-start: auto; margin-inline-end: 10px; }
    .head-acts .wa { width: 38px; height: 38px; }
    .head-acts .wa svg { width: 20px; height: 20px; }
    .addm { height: 30px; padding: 0 12px; border-radius: 999px; background: var(--terra); color: #fff; font-weight: 700; font-size: 14px; }
    .addm.wide { width: 100%; height: 38px; background: transparent; color: var(--terra); border: 1.5px dashed var(--coral); }
    .row {
      display: flex; flex-direction: column; justify-content: space-between; gap: 12px;
      background: var(--paper); border-radius: 20px; padding: 14px 14px 12px;
      box-shadow: 0 1px 0 rgba(63,56,47,.05), 0 0 0 1px rgba(232,213,190,.6);
    }
    .row .main { flex: 1; min-width: 0; text-align: right; }
    .row .acts { display: flex; align-items: center; justify-content: flex-start; gap: 8px; padding-top: 8px; border-top: 1px solid var(--line); }
    .row .name { font-weight: 700; font-size: 18px; }
    .row .age { display: inline-block; color: var(--muted); background: #EFE4D3; border-radius: 999px; padding: 1px 10px; font-weight: 600; margin-inline-start: 10px; font-size: 14px; vertical-align: middle; white-space: nowrap; }
    .row .nm { min-width: 0; display: flex; align-items: center; gap: 6px; }
    .row .gtag { flex: 0 0 auto; font-size: 12px; font-weight: 800; color: var(--muted); border: 1.5px solid var(--line); border-radius: 999px; min-width: 22px; height: 22px; display: inline-grid; place-items: center; padding: 0 5px; }
    .row .meta { display: flex; align-items: center; flex-wrap: nowrap; gap: 6px; margin-top: 3px; }
    .row .meta > * { flex: 0 0 auto; }
    .row .nm .name { min-width: 0; overflow-wrap: anywhere; line-height: 1.2; }
    .row .nm .age { margin-inline-start: 0; flex: 0 0 auto; }
    .row .ptag { display: inline-block; border-radius: 999px; padding: 1px 10px; font-weight: 700; font-size: 14px; white-space: nowrap; background: var(--red-bg); color: var(--red); }
    .row .ptag.paid { background: var(--green-bg); color: var(--green); }
    .row .main { cursor: pointer; }
    .pay.pi { width: 36px; height: 36px; padding: 0; display: grid; place-items: center; font-size: 18px; font-weight: 800; line-height: 1; }
    .pay.pi svg { width: 20px; height: 20px; }
    .row .phone { color: var(--ink); font-size: 15px; direction: ltr; unicode-bidi: isolate; }
    .row .note { color: var(--muted); font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .row .tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
    .tag { font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: var(--red-bg); color: var(--red); }
    .tag.paid { background: var(--green-bg); color: var(--green); }
    .tag.neutral { background: rgba(63,56,47,.10); color: var(--ink); }
    button.tag { cursor: pointer; border: 2px solid transparent; font-family: inherit; }
    button.tag[aria-pressed="true"] { border-color: currentColor; }
    .bar-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }

    .pay {
      flex: 0 0 auto; height: 36px; padding: 0 12px; border-radius: 999px; font-weight: 700; font-size: 14px;
      background: var(--red-bg); color: var(--red);
    }
    .pay.paid { background: var(--green-bg); color: var(--green); }
    .wa {
      flex: 0 0 auto; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center;
      background: var(--green); color: #fff;
    }
    .wa svg { width: 17px; height: 17px; }
    .wa.disabled { background: var(--line); pointer-events: none; }
    .call { background: #3F6FB5; }   /* שיחת טלפון */

    /* ---------- כניסה עם גוגל ---------- */
    body.locked .wrap, body.locked #addBtn { display: none !important; }
    .gate { max-width: 420px; margin: 0 auto; padding: 72px 20px; text-align: center; }
    .gate[hidden] { display: none; }
    .gate h1 { font-size: 30px; margin-bottom: 6px; }
    .gate p { color: var(--muted); margin-bottom: 26px; }
    .gate .gbtn { display: inline-flex; align-items: center; gap: 10px; background: var(--paper); color: var(--ink); border: 2px solid var(--line); border-radius: 999px; padding: 12px 22px; font-weight: 700; font-size: 17px; box-shadow: 0 1px 0 rgba(63,56,47,.05); cursor: pointer; }
    .gate .gbtn svg { width: 22px; height: 22px; }
    .gate .gerr { color: #A9533A; font-weight: 600; margin-top: 18px; min-height: 1.2em; }
    .gate .glink[hidden] { display: none; }
    .gate .glink { display: inline-block; margin-top: 16px; color: var(--muted); text-decoration: underline; cursor: pointer; background: none; font-size: 15px; }
    .signout { background: none; color: var(--muted); text-decoration: underline; font-size: 14px; cursor: pointer; margin-inline-start: 12px; }

    .empty { text-align: center; color: var(--muted); padding: 48px 16px; }
    .empty b { display: block; color: var(--ink); font-family: "Rubik", sans-serif; font-size: 19px; margin-bottom: 6px; }
    .error-box { background: var(--red-bg); color: var(--ink); border-radius: 16px; padding: 14px; margin-top: 12px; }

    .fab {
      position: fixed; left: 16px; bottom: calc(16px + env(safe-area-inset-bottom)); z-index: 6;
      height: 56px; padding: 0 22px; border-radius: 999px; background: var(--terra); color: #fff;
      font-weight: 700; font-size: 18px; box-shadow: 0 6px 18px rgba(201,111,82,.35);
    }
    @media (min-width: 1152px) { .fab { left: calc(50% - 544px); } }

    /* חלונות (bottom sheet במובייל) */
    dialog {
      border: 0; padding: 0; background: var(--paper); color: var(--ink);
      width: 100%; max-width: 520px; border-radius: 28px 28px 0 0;
      margin: auto auto 0; max-height: 92vh;
    }
    @media (min-width: 560px) { dialog { margin: auto; border-radius: 28px; } }
    dialog::backdrop { background: rgba(63,56,47,.4); }
    .sheet { padding: 20px 20px calc(20px + env(safe-area-inset-bottom)); }
    .sheet-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
    .sheet h2 { font-family: "Rubik", sans-serif; font-size: 21px; margin: 0; }
    .close { width: 40px; height: 40px; border-radius: 50%; background: var(--cream); font-size: 22px; line-height: 1; }
    .field { display: block; margin-bottom: 12px; }
    .field span { display: block; font-size: 14px; font-weight: 700; color: var(--muted); margin-bottom: 4px; }
    .name-row { display: flex; gap: 8px; align-items: flex-end; }
    .name-row .field { flex: 1; min-width: 0; }
    .seg { display: flex; gap: 6px; margin-bottom: 12px; }
    .seg label { position: relative; display: block; }
    .seg input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; width: 100%; height: 100%; }
    .seg span { display: block; height: 48px; line-height: 45px; padding: 0 12px; border-radius: 14px; border: 1.5px solid var(--line); background: #fff; font-weight: 700; font-size: 16px; }
    .seg input:checked + span { background: var(--terra); border-color: var(--terra); color: #fff; }
    .field select { width: 100%; height: 48px; border-radius: 14px; border: 1.5px solid var(--line); background: #fff; padding: 0 8px; font-size: 17px; }
    .field input {
      width: 100%; height: 48px; border-radius: 14px; border: 1.5px solid var(--line);
      background: #fff; padding: 0 12px; font-size: 17px;
    }
    .field input:focus { border-color: var(--terra); outline: none; }
    .field input[type="tel"] { direction: ltr; text-align: right; }
    .two { display: grid; grid-template-columns: 1fr 110px; gap: 10px; }
    .hint { font-size: 13px; color: var(--muted); margin-top: 4px; }
    .sect-title { font-size: 14px; font-weight: 700; color: var(--muted); margin: 6px 0 6px; }
    .mlist { display: grid; gap: 6px; margin-bottom: 14px; }
    .mrow { display: flex; align-items: center; gap: 8px; }
    .mtoggle {
      flex: 1; display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 12px;
      border-radius: 14px; border: 1.5px solid var(--line); background: #fff; font-weight: 600; text-align: right;
    }
    .mtoggle .box {
      width: 22px; height: 22px; border-radius: 7px; border: 2px solid var(--sand); display: grid; place-items: center;
      color: #fff; font-size: 14px; flex: 0 0 auto;
    }
    .mtoggle[aria-pressed="true"] { border-color: var(--terra); }
    .mtoggle[aria-pressed="true"] .box { background: var(--terra); border-color: var(--terra); }
    .mrow .pay[hidden] { display: none; }
    .btn {
      width: 100%; height: 52px; border-radius: 16px; background: var(--terra); color: #fff; font-weight: 700; font-size: 18px;
    }
    .btn:disabled { opacity: .5; }
    .btn.ghost { background: transparent; color: var(--red); height: 44px; font-size: 16px; margin-top: 6px; }
    .saved { font-size: 14px; color: var(--green); font-weight: 700; opacity: 0; transition: opacity .2s; }
    .saved.on { opacity: 1; }

    .toast {
      position: fixed; left: 50%; bottom: 90px; transform: translateX(-50%) translateY(20px);
      background: var(--ink); color: var(--paper); padding: 10px 16px; border-radius: 14px; font-weight: 600;
      opacity: 0; pointer-events: none; transition: .2s; z-index: 50; max-width: calc(100% - 32px);
    }
    .toast.on { opacity: 1; transform: translateX(-50%) translateY(0); }
    .test-note { font-size: 13px; color: var(--muted); text-align: center; margin-top: 28px; }
  </style>
</head>
<body class="locked">
  <div class="gate" id="gate" hidden>
    <h1>משתתפים</h1>
    <p>יוצאים להרפתקה</p>
    <button type="button" class="gbtn" id="gLogin">
      <svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.1H42V20H24v8h11.3C33.7 32.7 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 8 3l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.6-.4-3.9z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 8 3l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.3 0-9.7-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.1H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.6-.4-3.9z"/></svg>
      כניסה עם גוגל
    </button>
    <div class="gerr" id="gErr" role="alert"></div>
    <button type="button" class="glink" id="gOut" hidden>יציאה והחלפת חשבון</button>
  </div>

  <div class="wrap">
    <header class="top">
      <div class="title-row">
        <h1>משתתפים</h1>
        <button type="button" class="signout" id="signOut">יציאה</button>
      </div>
      <nav class="chips" id="chips" aria-label="סינון לפי מפגש"></nav>
      <div class="meeting-bar" id="meetingBar"></div>
      <label class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="חיפוש לפי שם או טלפון" autocomplete="off" aria-label="חיפוש" />
      </label>
    </header>

    <div id="status"></div>
    <ul class="list" id="list"></ul>
  </div>

  <button class="fab" id="addBtn" type="button">+ משתתף</button>

  <!-- משתתף -->
  <dialog id="pDlg" aria-labelledby="pTitle">
    <form class="sheet" id="pForm" method="dialog" novalidate>
      <div class="sheet-head">
        <h2 id="pTitle">משתתף חדש</h2>
        <span class="saved" id="savedMark">נשמר ✓</span>
        <span class="head-acts" id="pContact"></span>
        <button class="close" type="button" data-close aria-label="סגירה">×</button>
      </div>
      <div class="name-row">
        <label class="field"><span>שם</span><input name="name" required maxlength="60" autocomplete="off" /></label>
        <div class="seg" role="radiogroup" aria-label="מגדר">
          <label><input type="radio" name="gender" value="male" /><span>זכר</span></label>
          <label><input type="radio" name="gender" value="female" /><span>נקבה</span></label>
        </div>
      </div>
      <div class="two">
        <label class="field"><span>טלפון</span><input name="phone" type="tel" inputmode="tel" maxlength="20" autocomplete="off" /></label>
        <label class="field"><span>גיל</span><input name="age" type="number" inputmode="numeric" min="18" max="99" /></label>
      </div>
      <label class="field"><span>הערה קצרה</span><input name="note" maxlength="80" autocomplete="off" placeholder="למשל: הגיעה דרך פייסבוק" /></label>
      <div class="note" id="pRegLine" style="color:var(--muted);font-size:14px;margin:2px 4px 6px"></div>
      <div class="sect-title" id="pMeetTitle">מפגשים</div>
      <div class="mlist" id="pMeetings"></div>
      <button class="btn" id="pSubmit" type="submit">הוספה</button>
      <button class="btn ghost" id="pDelete" type="button">מחיקת משתתף</button>
    </form>
  </dialog>

  <!-- מפגש -->
  <dialog id="mDlg" aria-labelledby="mTitle">
    <form class="sheet" id="mForm" method="dialog" novalidate>
      <div class="sheet-head">
        <h2 id="mTitle">מפגש חדש</h2>
        <button class="close" type="button" data-close aria-label="סגירה">×</button>
      </div>
      <div class="two" style="grid-template-columns: 1fr 1fr">
        <label class="field"><span>תאריך</span><input name="date" type="date" required /></label>
        <label class="field"><span>שעה</span><input name="time" type="time" required value="20:00" /></label>
      </div>
      <button class="btn" id="mSubmit" type="submit">יצירת מפגש</button>
      <button class="btn ghost" id="mDelete" type="button">מחיקת מפגש</button>
    </form>
  </dialog>

  <dialog id="cDlg" aria-labelledby="cTitle" style="max-width:420px">
    <form class="sheet" method="dialog" novalidate>
      <h2 id="cTitle" style="margin-bottom:6px"></h2>
      <p id="cText" style="color:var(--muted);margin:0 0 16px"></p>
      <button class="btn" id="cYes" type="button">אישור</button>
      <button class="btn ghost" id="cNo" type="button" style="color:var(--muted)">ביטול</button>
    </form>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
  /* Supabase ייעודי לפרויקט (ezakarwqstnldqixgreb). המפתח ציבורי מעצם הגדרתו;
     מה שמותר באמת נקבע במדיניות RLS שב-admin/schema.sql */
  const DB = {
    url: 'https://ezakarwqstnldqixgreb.supabase.co',
    key: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV6YWthcndxc3RubGRxaXhncmViIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEyMTA3MzIsImV4cCI6MjEwNjc4NjczMn0.Bg0eFBC4zKjyJc5kBw3wLgSP-PkxLFVv3o7-4YUdq4c',
  };
  const T = { p: 'harpatka_participants', m: 'harpatka_meetings', a: 'harpatka_attendance' };

  const state = { participants: [], meetings: [], att: [], filter: null, q: '', pay: null };
  /* קישור עמוק מהמייל: ?m=<מפגש>&p=<משתתף>; נשמר בזמן הכניסה עם גוגל (שמחזירה בלי הפרמטרים) */
  let deep = null;
  try {
    const sp = new URLSearchParams(location.search);
    if (['m', 'p', 'pay', 'q', 'em'].some((k) => sp.get(k))) { deep = { m: sp.get('m'), p: sp.get('p'), pay: sp.get('pay'), q: sp.get('q'), em: sp.get('em') }; sessionStorage.setItem('harpatka_deep', JSON.stringify(deep)); }
    else { deep = JSON.parse(sessionStorage.getItem('harpatka_deep') || 'null'); }
  } catch (e) {}
  const $ = (s) => document.querySelector(s);

  /* מצב המסך נשמר ב-URL (מפגש, סינון תשלום, חיפוש, חלון פתוח) כדי שאפשר יהיה לשתף */
  let urlReady = false, openPid = null;
  function syncUrl() {
    if (!urlReady) return;
    const sp = new URLSearchParams();
    if (state.filter) sp.set('m', state.filter);
    if (state.filter && state.pay) sp.set('pay', state.pay);
    if (state.q.trim()) sp.set('q', state.q.trim());
    if (openPid) sp.set('p', openPid);
    if (editingMeeting && mDlg.open) sp.set('em', editingMeeting.id);
    const s = sp.toString();
    try { history.replaceState(null, '', location.pathname + (s ? '?' + s : '')); } catch (e) {}
  }

  /* ---------- כניסה עם גוגל (הזדהות של floa ב-Supabase, בלי SDK) ---------- */
  const ADMINS = ['ofir.aviram@gmail.com', 'luriahadar@gmail.com'];            // תצוגה בלבד; האכיפה האמיתית ב-RLS (admin/auth.sql, טבלת harpatka_admins)
  const SKEY = 'harpatka_admin_session_v2';   // שם חדש: מתעלם מכניסות ישנות של פרויקט floa
  let session = null;
  const jwtData = (tok) => { try { return JSON.parse(decodeURIComponent(escape(atob(tok.split('.')[1].replace(/-/g, '+').replace(/_/g, '/'))))); } catch (e) { return {}; } };
  const saveSession = (s) => { session = s; try { localStorage.setItem(SKEY, JSON.stringify(s)); } catch (e) {} };
  const clearSession = () => { session = null; try { localStorage.removeItem(SKEY); } catch (e) {} };
  const sessionOk = (s) => s && s.access_token && (jwtData(s.access_token).exp || 0) * 1000 > Date.now() + 30000;
  async function refreshSession() {
    if (!session || !session.refresh_token) return false;
    try {
      const r = await fetch(DB.url + '/auth/v1/token?grant_type=refresh_token', { method: 'POST', headers: { apikey: DB.key, 'Content-Type': 'application/json' }, body: JSON.stringify({ refresh_token: session.refresh_token }) });
      if (!r.ok) return false;
      const d = await r.json(); saveSession({ access_token: d.access_token, refresh_token: d.refresh_token });
      if (typeof rtSend === 'function') rtSend({ topic: RT_TOPIC, event: 'access_token', payload: { access_token: d.access_token }, ref: String(Date.now()) });
      return true;
    } catch (e) { return false; }
  }
  const emailOf = () => String((session && jwtData(session.access_token).email) || '').toLowerCase();
  const gateMsg = (m) => { $('#gErr').textContent = m || ''; };
  function showGate(msg, canSwitch) {
    document.body.classList.add('locked'); $('#gate').hidden = false; gateMsg(msg); $('#gOut').hidden = !canSwitch;
  }
  /* ---------- זמן אמת (Supabase Realtime, WebSocket ישיר בלי SDK) ----------
     כל שינוי בטבלאות (מהטופס באתר, מהדר או מכל מכשיר אחר) מרענן את המסך. דורש שהטבלאות ב-publication (admin/realtime.sql) */
  let rtWs = null, rtHb = 0, rtRetry = 1000, rtDebounce = 0, rtAlive = false;
  const RT_TOPIC = 'realtime:harpatka';
  const rtSend = (o) => { if (rtWs && rtWs.readyState === 1) rtWs.send(JSON.stringify(o)); };
  function scheduleRefresh() { clearTimeout(rtDebounce); rtDebounce = setTimeout(() => load(true), 350); }
  function startRealtime() {
    if (!session || rtWs) return;
    let ws;
    try { ws = new WebSocket(DB.url.replace(/^http/, 'ws') + '/realtime/v1/websocket?apikey=' + encodeURIComponent(DB.key) + '&vsn=1.0.0'); } catch (e) { return; }
    rtWs = ws;
    ws.onopen = () => {
      rtRetry = 1000;
      rtSend({ topic: RT_TOPIC, event: 'phx_join', ref: '1', payload: { config: { broadcast: { ack: false, self: false }, presence: { key: '' }, private: false,
        postgres_changes: [T.p, T.m, T.a].map((table) => ({ event: '*', schema: 'public', table })) }, access_token: session.access_token } });
      rtHb = setInterval(() => rtSend({ topic: 'phoenix', event: 'heartbeat', payload: {}, ref: String(Date.now()) }), 25000);
    };
    ws.onmessage = (e) => {
      let m; try { m = JSON.parse(e.data); } catch (x) { return; }
      if (m.event === 'phx_reply' && m.topic === RT_TOPIC && m.ref === '1') {
        rtAlive = m.payload && m.payload.status === 'ok';
        if (rtAlive) scheduleRefresh();   // מה שהוחמץ בזמן שהחיבור היה סגור
      } else if (m.event === 'postgres_changes') scheduleRefresh();
      else if (m.event === 'system' && m.payload && m.payload.status === 'error') { rtAlive = false; }
    };
    ws.onclose = () => {
      clearInterval(rtHb); rtWs = null; rtAlive = false;
      if (session) setTimeout(startRealtime, rtRetry), rtRetry = Math.min(rtRetry * 2, 30000);
    };
    ws.onerror = () => { try { ws.close(); } catch (x) {} };
  }
  document.addEventListener('visibilitychange', () => { if (!document.hidden && session) { load(true); if (!rtWs) startRealtime(); } });

  async function startAuth() {
    const h = new URLSearchParams(location.hash.replace(/^#/, ''));
    if (h.get('access_token')) {
      saveSession({ access_token: h.get('access_token'), refresh_token: h.get('refresh_token') });
      history.replaceState(null, '', location.pathname + location.search);
    } else if (h.get('error_description')) {
      history.replaceState(null, '', location.pathname + location.search);
      showGate('הכניסה נכשלה: ' + h.get('error_description').replace(/\+/g, ' ')); return;
    } else {
      try { session = JSON.parse(localStorage.getItem(SKEY) || 'null'); } catch (e) { session = null; }
    }
    if (session && !sessionOk(session) && !(await refreshSession())) clearSession();
    if (!session) { showGate(''); return; }
    if (!ADMINS.includes(emailOf())) { showGate('אין הרשאה לחשבון ' + emailOf(), true); return; }
    document.body.classList.remove('locked'); $('#gate').hidden = true;
    load();
    startRealtime();
  }

  async function api(path, { method = 'GET', body, prefer } = {}) {
    const headers = { apikey: DB.key, Authorization: 'Bearer ' + ((session && session.access_token) || DB.key) };
    if (body) headers['Content-Type'] = 'application/json';
    if (prefer) headers.Prefer = prefer;
    let res = await fetch(DB.url + '/rest/v1/' + path, { method, headers, body: body ? JSON.stringify(body) : undefined });
    if (res.status === 401 && session && await refreshSession()) {
      headers.Authorization = 'Bearer ' + session.access_token;
      res = await fetch(DB.url + '/rest/v1/' + path, { method, headers, body: body ? JSON.stringify(body) : undefined });
    }
    const text = await res.text();
    const data = text ? JSON.parse(text) : null;
    if (!res.ok) {
      const err = new Error((data && data.message) || ('HTTP ' + res.status));
      err.code = data && data.code;
      throw err;
    }
    return data;
  }

  /* ---------- עזרים ---------- */
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const digits = (s) => String(s || '').replace(/\D/g, '');
  const todayISO = () => {
    const d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  };

  /* גיל מוצג = הגיל שהוקלד + שנים מלאות מאז שהוקלד */
  function shownAge(p) {
    if (p.age == null) return null;
    const [y, m, d] = String(p.age_set_at || todayISO()).split('-').map(Number);
    const now = new Date();
    let years = now.getFullYear() - y;
    if (now.getMonth() + 1 < m || (now.getMonth() + 1 === m && now.getDate() < d)) years--;
    return p.age + Math.max(0, years);
  }

  const CALL_ICON = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.6 21 3 13.4 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1l-2.3 2.2z"/></svg>';
  /* קישור שיחה (tel:) בפורמט בינלאומי; מספר ישראלי מקומי הופך ל-+972 */
  function telLink(phone) {
    const raw = String(phone || '').trim();
    let n = digits(raw);
    if (!n) return null;
    if (raw.startsWith('+')) return 'tel:+' + n;
    if (n.startsWith('00')) return 'tel:+' + n.slice(2);
    if (n.startsWith('0')) return 'tel:+972' + n.slice(1);
    if (n.length === 9) return 'tel:+972' + n;
    return 'tel:+' + n;
  }
  /* תאריך הרשמה/יצירה (created_at), בשעון ישראל: 5.10.26 */
  function regDate(p) {
    if (!p.created_at) return '';
    const d = new Date(p.created_at); if (isNaN(d)) return '';
    const parts = new Intl.DateTimeFormat('en-GB', { timeZone: 'Asia/Jerusalem', day: 'numeric', month: 'numeric', year: '2-digit' }).formatToParts(d);
    const g = (k) => parts.find((x) => x.type === k).value;
    return g('day') + '.' + g('month') + '.' + g('year');
  }
  function waLink(phone) {
    let n = digits(phone);
    if (!n) return null;
    if (n.startsWith('0')) n = '972' + n.slice(1);
    else if (n.length === 9) n = '972' + n;
    return 'https://wa.me/' + n;
  }

  function fmtPhone(phone) {
    const n = digits(phone);
    if (n.length === 10 && n.startsWith('0')) return n.slice(0, 3) + ' ' + n.slice(3, 6) + ' ' + n.slice(6);
    return phone || '';
  }

  const DAYS = ['א׳', 'ב׳', 'ג׳', 'ד׳', 'ה׳', 'ו׳', 'ש׳'];
  function meetingLabel(m, withDay) {
    const [y, mo, d] = m.meeting_date.split('-').map(Number);
    const day = DAYS[new Date(y, mo - 1, d).getDay()];
    return (withDay ? 'יום ' + day + ' ' : '') + d + '.' + mo + ' · ' + String(m.meeting_time).slice(0, 5);
  }
  const isPast = (m) => m.meeting_date < todayISO();
  const sortMeetings = () => state.meetings.sort((a, b) => (b.meeting_date + b.meeting_time).localeCompare(a.meeting_date + a.meeting_time));   // מהחדש לישן

  const linksOf = (pid) => state.att.filter((a) => a.participant_id === pid);
  const linkOf = (pid, mid) => state.att.find((a) => a.participant_id === pid && a.meeting_id === mid);

  let toastTimer;

    const t = $('#toast');

  /* ---------- טעינה ---------- */
  async function load(silent) {
    if (!silent) $('#status').innerHTML = '<div class="empty">טוען…</div>';
    try {
      const [p, m, a] = await Promise.all([
        api(T.p + '?select=*'),
        api(T.m + '?select=*'),
        api(T.a + '?select=participant_id,meeting_id,paid'),
      ]);
      state.participants = p; state.meetings = m; state.att = a;
      sortMeetings();
      if (!silent) $('#status').innerHTML = '';
      if (deep) {
        const d = deep; deep = null;
        try { sessionStorage.removeItem('harpatka_deep'); } catch (e) {}
        if (d.m && state.meetings.some((x) => x.id === d.m)) state.filter = d.m;
        if (state.filter && (d.pay === 'paid' || d.pay === 'unpaid')) state.pay = d.pay;
        if (d.q) { state.q = d.q; $('#q').value = d.q; }
        urlReady = true;
        render();
        if (d.p && state.participants.some((x) => x.id === d.p)) openParticipant(d.p);

      if (silent) return;   // רענון שקט שנכשל: משאירים את מה שמוצג
      const missing = err.code === 'PGRST205' || err.code === '42P01' || /does not exist|schema cache/i.test(err.message);
      $('#status').innerHTML = '<div class="error-box">' + (missing
        ? '<b>הטבלאות עוד לא קיימות.</b><br>צריך להריץ פעם אחת את <code>admin/schema.sql</code> ב-SQL Editor של Supabase'

  const WA_ICON = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M17.5 14.4c-.3-.1-1.7-.8-2-.9-.3-.1-.5-.1-.7.1-.2.3-.8.9-.9 1.1-.2.2-.3.2-.6.1-.3-.1-1.2-.5-2.3-1.4-.9-.8-1.4-1.7-1.6-2-.2-.3 0-.4.1-.6l.4-.5c.1-.2.2-.3.3-.5.1-.2 0-.4 0-.5l-.9-2.2c-.2-.6-.5-.5-.7-.5h-.6c-.2 0-.5.1-.8.4-.3.3-1 1-1 2.4s1 2.8 1.2 3c.1.2 2 3.1 4.9 4.3.7.3 1.2.5 1.6.6.7.2 1.3.2 1.8.1.6-.1 1.7-.7 1.9-1.4.2-.7.2-1.2.2-1.4-.1-.1-.3-.2-.6-.3zM12 21.5c-1.7 0-3.4-.5-4.8-1.3l-.3-.2-3.6.9 1-3.5-.2-.4C3.2 15.6 2.7 13.8 2.7 12c0-5.1 4.2-9.3 9.3-9.3 2.5 0 4.8 1 6.6 2.7 1.8 1.8 2.7 4.1 2.7 6.6 0 5.2-4.2 9.5-9.3 9.5zM20 4C17.9 1.8 15 .7 12 .7 5.8.7.7 5.8.7 12c0 2 .5 3.9 1.5 5.6L.6 23.4l6-1.6c1.6.9 3.5 1.4 5.4 1.4 6.2 0 11.3-5.1 11.3-11.3 0-3-1.2-5.8-3.3-7.9z"/></svg>';

  /* ---------- סטטוס תשלום ---------- */
  function confirmPaid(pid, mid, paid) {

  async function setPaid(pid, mid, paid) {
    const l = linkOf(pid, mid);
    if (!l) return;
    const prev = l.paid;
    l.paid = paid; render(); refreshSheetMeetings();
    try {
      await api(T.a + '?participant_id=eq.' + pid + '&meeting_id=eq.' + mid, { method: 'PATCH', body: { paid } });
    } catch (err) { l.paid = prev; render(); refreshSheetMeetings(); fail(err); }
  }

  async function setLinked(pid, mid, on) {
    if (on) {
      const row = { participant_id: pid, meeting_id: mid, paid: false };
      state.att.push(row); render(); refreshSheetMeetings();
      try { await api(T.a, { method: 'POST', body: row, prefer: 'resolution=ignore-duplicates' }); }
      catch (err) { state.att = state.att.filter((a) => a !== row); render(); refreshSheetMeetings(); fail(err); }
    } else {
      const prev = state.att;
      state.att = state.att.filter((a) => !(a.participant_id === pid && a.meeting_id === mid));
      render(); refreshSheetMeetings();
      try { await api(T.a + '?participant_id=eq.' + pid + '&meeting_id=eq.' + mid, { method: 'DELETE' }); }
      catch (err) { state.att = prev; render(); refreshSheetMeetings(); fail(err); }
    }
  }

  /* ---------- חלון משתתף ---------- */
  const pDlg = $('#pDlg'), pForm = $('#pForm');
  let sheet = null; // { id } לעריכה, או { id: null, links: Map } למשתתף חדש

  function openParticipant(id) {
    const p = id ? state.participants.find((x) => x.id === id) : null;
    sheet = p ? { id: p.id } : { id: null, links: new Map(state.filter ? [[state.filter, false]] : []) };
    pForm.reset();
    pForm.name.value = p ? p.name : '';
    pForm.phone.value = p ? p.phone : '';
    pForm.age.value = p ? (shownAge(p) ?? '') : '';
    if (p && p.gender) pForm.gender.value = p.gender;
    pForm.note.value = p ? p.note : '';
    $('#pTitle').textContent = p ? 'עריכת משתתף' : 'משתתף חדש';
    $('#pRegLine').textContent = p && regDate(p) ? ('תאריך הרשמה: ' + regDate(p) + (p.source === 'site' ? ' (דרך האתר)' : '')) : '';
    { const wa = p && waLink(p.phone), tel = p && telLink(p.phone);
      $('#pContact').innerHTML = p
        ? (wa ? '<a class="wa" href="' + wa + '" target="_blank" rel="noopener" aria-label="וואטסאפ">' + WA_ICON + '</a>' : '') +
          (tel ? '<a class="wa call" href="' + tel + '" aria-label="שיחה">' + CALL_ICON + '</a>' : '')
        : ''; }
    $('#pSubmit').hidden = !!p;
    $('#pDelete').hidden = !p;
    $('#savedMark').classList.remove('on');
    refreshSheetMeetings();
    openPid = p ? p.id : null;
    pDlg.showModal();
    syncUrl();
    if (!p) setTimeout(() => pForm.name.focus(), 50);
  }

  function refreshSheetMeetings() {
    if (!sheet) return;
    const box = $('#pMeetings');
    $('#pMeetTitle').hidden = !state.meetings.length;
    box.innerHTML = state.meetings.map((m) => {
      let on, paid;
      if (sheet.id) { const l = linkOf(sheet.id, m.id); on = !!l; paid = l && l.paid; }
      else { on = sheet.links.has(m.id); paid = sheet.links.get(m.id); }
      return '<div class="mrow">' +
        '<button type="button" class="mtoggle" data-mt="' + m.id + '" aria-pressed="' + on + '"><span class="box">' + (on ? '✓' : '') + '</span>' + esc(meetingLabel(m, true)) + '</button>' +
        '<button type="button" class="pay' + (paid ? ' paid' : '') + '" data-mp="' + m.id + '"' + (on ? '' : ' hidden') + '>' + (paid ? 'שילם' : 'טרם שילם') + '</button>' +
      '</div>';
    }).join('');
  }

  $('#pMeetings').addEventListener('click', (e) => {
    const t = e.target.closest('[data-mt]'), pay = e.target.closest('[data-mp]');
    if (t) {
      const mid = t.dataset.mt, on = t.getAttribute('aria-pressed') !== 'true';
      if (sheet.id) setLinked(sheet.id, mid, on);
      else { on ? sheet.links.set(mid, false) : sheet.links.delete(mid); refreshSheetMeetings(); }
    } else if (pay) {
      const mid = pay.dataset.mp;
      if (sheet.id) confirmPaid(sheet.id, mid, !linkOf(sheet.id, mid).paid);
      else { sheet.links.set(mid, !sheet.links.get(mid)); refreshSheetMeetings(); }
    }
  });

  function readForm() {
    const age = parseInt(pForm.age.value, 10);
    return {
      name: pForm.name.value.trim(),
      phone: pForm.phone.value.trim(),
      age: Number.isFinite(age) ? age : null,
      gender: pForm.gender.value || null,
      note: pForm.note.value.trim(),
    };
  }

  /* עריכה: שמירה אוטומטית של כל שדה ששונה */
  let savedTimer;
  pForm.addEventListener('change', async (e) => {
    if (!sheet || !sheet.id || !e.target.name) return;
    const p = state.participants.find((x) => x.id === sheet.id);
    const v = readForm();
    const field = e.target.name;
    if (field === 'name' && !v.name) { pForm.name.value = p.name; return; }
    const patch = { [field]: v[field] };
    if (field === 'age') patch.age_set_at = todayISO();
    const prev = { ...p };
    Object.assign(p, patch); render();
    try {
      await api(T.p + '?id=eq.' + p.id, { method: 'PATCH', body: patch });
      const mark = $('#savedMark');
      mark.classList.add('on'); clearTimeout(savedTimer);
      savedTimer = setTimeout(() => mark.classList.remove('on'), 1500);
    } catch (err) { Object.assign(p, prev); render(); fail(err); }
  });

  /* משתתף חדש */
  pForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    if (!sheet || sheet.id) { pDlg.close(); return; }
    const v = readForm();
    if (!v.name) { pForm.name.focus(); toast('חסר שם'); return; }
    const btn = $('#pSubmit'); btn.disabled = true;
    try {
      const [p] = await api(T.p, { method: 'POST', body: { ...v, age_set_at: todayISO() }, prefer: 'return=representation' });
      state.participants.push(p);
      const rows = [...sheet.links].map(([mid, paid]) => ({ participant_id: p.id, meeting_id: mid, paid: !!paid }));
      if (rows.length) { await api(T.a, { method: 'POST', body: rows }); state.att.push(...rows); }
      pDlg.close(); render(); toast('✓ ' + p.name + ' ברשימה');
    } catch (err) { fail(err); }
    btn.disabled = false;
  });

  $('#pDelete').addEventListener('click', async () => {
    const p = state.participants.find((x) => x.id === sheet.id);
    if (!p || !confirm('למחוק את ' + p.name + '?')) return;
    try {
      await api(T.p + '?id=eq.' + p.id, { method: 'DELETE' });
      state.participants = state.participants.filter((x) => x !== p);
      state.att = state.att.filter((a) => a.participant_id !== p.id);
      pDlg.close(); render(); toast('נמחק');
    } catch (err) { fail(err); }
  });

  /* ---------- חלון מפגש ---------- */
  const mDlg = $('#mDlg'), mForm = $('#mForm');
  let editingMeeting = null;

  function openMeeting(id) {
    const m = id ? state.meetings.find((x) => x.id === id) : null;
    editingMeeting = m;
    mForm.date.value = m ? m.meeting_date : '';
    mForm.time.value = m ? String(m.meeting_time).slice(0, 5) : '20:00';
    $('#mTitle').textContent = m ? 'עריכת מפגש' : 'מפגש חדש';
    $('#mSubmit').textContent = m ? 'שמירה' : 'יצירת מפגש';
    $('#mDelete').hidden = !m;
    mDlg.showModal();
    syncUrl();
  }

  mForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const body = { meeting_date: mForm.date.value, meeting_time: mForm.time.value || '20:00' };
    if (!body.meeting_date) { mForm.date.focus(); toast('חסר תאריך'); return; }
    const btn = $('#mSubmit'); btn.disabled = true;
    try {
      if (editingMeeting) {
        await api(T.m + '?id=eq.' + editingMeeting.id, { method: 'PATCH', body });
        Object.assign(editingMeeting, body);
      } else {
        const [m] = await api(T.m, { method: 'POST', body, prefer: 'return=representation' });
        state.meetings.push(m);
        state.filter = m.id;
      }
      sortMeetings(); mDlg.close(); render();
    } catch (err) { fail(err); }
    btn.disabled = false;
  });

  $('#mDelete').addEventListener('click', async () => {
    const m = editingMeeting;
    const n = state.att.filter((a) => a.meeting_id === m.id).length;
    if (!confirm('למחוק את המפגש ' + meetingLabel(m) + '?' + (n ? '\n' + n + ' משתתפים ינותקו ממנו (הם עצמם לא יימחקו)' : ''))) return;
    try {
      await api(T.m + '?id=eq.' + m.id, { method: 'DELETE' });
      state.meetings = state.meetings.filter((x) => x !== m);
      state.att = state.att.filter((a) => a.meeting_id !== m.id);
      state.filter = null; mDlg.close(); render();
    } catch (err) { fail(err); }
  });

  /* ---------- אירועים כלליים ---------- */
  document.querySelectorAll('[data-close]').forEach((b) => b.addEventListener('click', () => b.closest('dialog').close()));
  document.querySelectorAll('dialog').forEach((d) => d.addEventListener('click', (e) => { if (e.target === d) d.close(); }));
  pDlg.addEventListener('close', () => { sheet = null; openPid = null; syncUrl(); });
  mDlg.addEventListener('close', syncUrl);

  $('#q').addEventListener('input', (e) => { state.q = e.target.value; renderList(); syncUrl(); });
  $('#addBtn').addEventListener('click', () => openParticipant(null));

  $('#chips').addEventListener('click', (e) => {
    if (e.target.closest('#addMeeting')) return openMeeting(null);
    const c = e.target.closest('[data-filter]');
    if (!c) return;
    state.filter = c.dataset.filter || null; state.pay = null;
    render();
  });
  $('#meetingBar').addEventListener('click', (e) => {
    if (e.target.closest('#editMeeting')) return openMeeting(state.filter);
    const f = e.target.closest('[data-pay-filter]');
    if (f) { const v = f.dataset.payFilter || null; state.pay = (state.pay === v ? null : v); render(); }
  });

  $('#list').addEventListener('keydown', (e) => {
    if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[data-edit]')) { e.preventDefault(); openParticipant(e.target.dataset.edit); }
  });
  $('#list').addEventListener('click', (e) => {
    const am = e.target.closest('[data-addm]');
    if (am) { setLinked(am.dataset.addm, state.filter, true); state.q = ''; $('#q').value = ''; renderList(); toast('נוסף למפגש'); return; }
    if (e.target.closest('#addNew')) {
      const q = state.q.trim(); openParticipant(null);
      if (digits(q).length >= 6) pForm.phone.value = q; else pForm.name.value = q;
      return;
    }
    const pay = e.target.closest('[data-pay]');
    if (pay) return confirmPaid(pay.dataset.pay, state.filter, !pay.classList.contains('paid'));
    const ed = e.target.closest('[data-edit]');
    if (ed) openParticipant(ed.dataset.edit);
  });

  const goGoogle = () => { location.href = DB.url + '/auth/v1/authorize?provider=google&redirect_to=' + encodeURIComponent(location.origin + location.pathname); };
  $('#gLogin').addEventListener('click', goGoogle);
  const signOut = () => { clearSession(); try { if (rtWs) rtWs.close(); } catch (e) {} location.reload(); };
  $('#gOut').addEventListener('click', signOut);
  $('#signOut').addEventListener('click', signOut);
  startAuth();
  </script>
</body>
</html>
