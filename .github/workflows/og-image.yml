name: תמונת שיתוף למפגש הקרוב
on:
  schedule:
    - cron: '30 21 * * *'   # כל לילה (כ-00:30 בישראל)
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: og-image
  cancel-in-progress: false
jobs:
  og:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright && python -m playwright install --with-deps chromium
      - run: python tools/og/update.py
      - name: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images index.html v7/index.html
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "תמונת שיתוף: עדכון אוטומטי למפגש הקרוב"
          git pull --rebase origin main
          git push origin main
