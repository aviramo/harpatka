<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@600;700&family=Rubik:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root { --terra:#C96F52; --ink:#3F382F; --paper:#FFFDF9; --sand:#E8D5BE; }
  html,body{margin:0;width:1200px;height:1200px;overflow:hidden;font-family:"Assistant",sans-serif}
  .bg{position:absolute;inset:0;background:url("__BG__") center/cover}
  .card{position:absolute;left:48px;right:48px;bottom:48px;background:rgba(255,253,249,.95);border-radius:40px;padding:30px 48px 34px;text-align:center;box-shadow:0 18px 50px rgba(63,56,47,.28)}
  .card.nodetails{padding-top:44px;padding-bottom:48px}
  .card.nodetails .brand{font-size:64px}
  .card.nodetails .freq{font-size:52px;margin-top:8px}
  .brand{font-family:"Rubik",sans-serif;font-weight:700;font-size:40px;color:var(--ink)}
  .freq{font-weight:700;font-size:40px;color:var(--terra);margin-top:2px}
  .line{height:3px;width:120px;background:var(--sand);border-radius:2px;margin:18px auto 16px}
  .kick{font-family:"Rubik",sans-serif;font-weight:600;font-size:32px;color:var(--terra);letter-spacing:.2px}
  .when{font-family:"Rubik",sans-serif;font-weight:700;font-size:88px;line-height:1.1;color:var(--ink);margin-top:2px}
  .meta{display:flex;justify-content:center;align-items:center;font-weight:700;font-size:50px;color:var(--ink);margin-top:6px;opacity:.9}
  .meta i{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--terra);margin:0 22px}
</style></head><body>
<div class="bg"></div>
<div class="card __CLS__">
  <div class="brand">יוצאים להרפתקה</div>
  <div class="freq">מפגשי תנועה קבועים</div>
  <div class="details" __DETAILS__>
  <div class="line"></div>
  <div class="kick">המפגש הקרוב</div>
  <div class="when">__WHEN__</div>
  <div class="meta"><span>__TIME__</span><i></i><span>__PLACE__</span></div>
  </div>
</div></body></html>
