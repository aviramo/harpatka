<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>תמונות למודעות</title>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@600&display=swap" rel="stylesheet">
  <link rel="icon" href="../images/favicon-v4.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="../images/favicon-v4-32.png" />
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&family=Assistant:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root{ --cream:#F6EFE4; --ink:#3F382F; }
    *{ box-sizing:border-box; margin:0; }
    body{ background:var(--cream); color:var(--ink); }
    .grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(16rem,1fr)); gap:1rem; padding:1rem; }
    .grid figure{ display:block; }
    .grid .n{ display:block; font-family:Rubik,Assistant,sans-serif; font-weight:600; font-size:.95rem; line-height:1; color:#8a7f6e; padding:0 .15rem .4rem; }
    .grid img{ width:100%; height:auto; aspect-ratio:4/5; display:block; }
  </style>
</head>
<body>
  <div id="grid" class="grid"></div>
  <script>
    fetch('ads.json').then(r => r.json()).then(items => {
      const g = document.getElementById('grid');
      items.forEach(it => {
        const f = document.createElement('figure');
        const n = document.createElement('span'); n.className = 'n'; n.textContent = it.id;
        const im = document.createElement('img');
        im.loading = 'lazy'; im.width = 1080; im.height = 1350; im.src = 'img/' + it.file; im.alt = it.text;
        f.appendChild(n); f.appendChild(im); g.appendChild(f);
      });
    });
  </script>
</body>
</html>
