    const toastEl = document.createElement('div'); toastEl.className = 'toast'; toastEl.setAttribute('role', 'status');
    document.body.appendChild(toastEl);
    let toastT;
    const toast = msg => { toastEl.textContent = msg; toastEl.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => toastEl.classList.remove('on'), 2400); };

    // שיתוף: הקובץ עצמו (וואטסאפ, פייסבוק...) דרך תפריט השיתוף של המכשיר. הקובץ נטען כבר כשהתפריט נפתח,
    // כי navigator.share חייב לרוץ מיד אחרי הלחיצה. בלי שיתוף קבצים: שיתוף קישור, ואם גם זה לא קיים, העתקת הקישור.
    const files = {};
    const getFile = (url, name, type) => files[url] || (files[url] = fetch(url).then(r => r.ok ? r.blob() : Promise.reject(r.status))
      .then(b => new File([b], name, { type })).catch(e => { delete files[url]; throw e; }));
    async function share(url, name, type) {
      const abs = new URL(url, location.href).href;
      try {
        const file = await getFile(url, name, type);
        if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file] }); return; }
      } catch (e) {
        if (e && e.name === 'AbortError') return;   // תפריט השיתוף נסגר בלי שיתוף
        if (e && e.name === 'NotAllowedError') { toast('הקובץ מוכן, אפשר ללחוץ שוב על שיתוף'); return; }
      }
      if (navigator.share) { navigator.share({ url: abs }).catch(() => {}); return; }
      try { await navigator.clipboard.writeText(abs); toast('הקישור הועתק'); } catch (e) { window.prompt('הקישור לקובץ:', abs); }

    let shieldT;
    const hideShield = () => { clearTimeout(shieldT); shield.hidden = true; };
    const closeMenu = () => { if (openMore) { const w = openMore; w.classList.remove('open'); w.querySelector('.dots').setAttribute('aria-expanded', 'false'); openMore = null; w.dispatchEvent(new Event('menuclose')); } };
    const closeMore = () => { closeMenu(); hideShield(); };
    shield.addEventListener('pointerdown', closeMenu);
    ['pointerup', 'pointercancel'].forEach(ev => shield.addEventListener(ev, () => { shieldT = setTimeout(hideShield, 350); }));
    shield.addEventListener('click', hideShield);
    shield.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
    shield.addEventListener('wheel', e => { e.preventDefault(); closeMore(); }, { passive: false });
    document.addEventListener('click', e => { if (openMore && !openMore.contains(e.target)) closeMore(); });

    function moreMenu(name, base, img, vid) {

    const FS_NATIVE = FS_MOBILE && !Element.prototype.requestFullscreen;
    let fsOpen = null;   // הסרטון שממלא עכשיו את המסך
    const fsEnter = m => { m.classList.add('fsx'); document.documentElement.classList.add('vid-open'); fsOpen = m; history.pushState({ adVideo: 1 }, ''); };
    const fsExit = m => { closeMore(); m.classList.remove('fsx', 'swiping'); m.style.transform = m.style.transition = ''; document.documentElement.classList.remove('vid-open'); if (fsOpen === m) { fsOpen = null; history.back(); } };
    window.addEventListener('popstate', () => { if (fsOpen) { const m = fsOpen; fsOpen = null; m._stop(); } });   // כפתור החזרה סוגר את הסרטון ולא עוזב את הדף
    /* החלקה למטה בזמן צפייה: הסרטון יורד עם האצבע, ומעבר לסף (או בהחלקה מהירה) נסגר וחוזרים למודעות. לא על פס הבקרה */
    let sw = null;
    const STILL = matchMedia('(prefers-reduced-motion: reduce)').matches;
    const fsSlideOut = (m, done) => {   // הסרטון יורד כמו פופאפ, ואז חוזרים למודעות
      if (m._out) return;
      if (STILL) { done(); return; }
      m._out = true; m.style.transition = 'transform .22s ease-in'; m.style.transform = 'translateY(100%)';
      setTimeout(() => { m._out = false; done(); }, 220);
    };
    const swEnd = (e, cancel) => {
      if (!sw || e.pointerId !== sw.id) return;
      const s = sw, m = fsOpen; sw = null;
      if (!m) return;
      const dy = e.clientY - s.y, dx = e.clientX - s.x;
      if (!s.on && !(dy > 30 && dy > Math.abs(dx))) return;   // החלקה מהירה מאוד מגיעה בלי תזוזות ביניים
      const d = Math.max(0, dy);
      if (!cancel && (d > 90 || (d > 30 && d / Math.max(1, e.timeStamp - s.t) > 0.35))) { m._stop(); return; }
      m.style.transition = 'transform .18s ease-out'; m.style.transform = '';
      setTimeout(() => { m.classList.remove('swiping'); m.style.transition = ''; }, 180);
    };
    document.addEventListener('pointerdown', e => { if (fsOpen && !e.target.closest('.ctl')) sw = { id: e.pointerId, x: e.clientX, y: e.clientY, t: e.timeStamp, dy: 0, on: false }; });
    document.addEventListener('pointermove', e => {
      if (!sw || e.pointerId !== sw.id || !fsOpen) return;
      const dy = e.clientY - sw.y, dx = e.clientX - sw.x;
      if (!sw.on && dy > 10 && dy > Math.abs(dx)) { sw.on = true; fsOpen.classList.add('swiping'); }
      if (sw.on) { sw.dy = Math.max(0, dy); if (!STILL) fsOpen.style.transform = 'translateY(' + sw.dy + 'px)'; }
    });
    document.addEventListener('touchmove', e => { if (fsOpen && !e.target.closest('.ctl')) e.preventDefault(); }, { passive: false });   // בלי גלילה מאחור (touch-action היה בולע את הנגיעה הבאה)
    document.addEventListener('pointerup', e => swEnd(e, false));
    document.addEventListener('pointercancel', e => swEnd(e, true));
    const stops = [];   // סרטון אחד בכל פעם: כשאחד מתחיל לנגן, כל השאר עוצרים וחוזרים לתמונה
    // גלילה: סרטון שיוצא מהמסך (נשאר ממנו פחות מרבע) נעצר וחוזר לתמונה
    const io = 'IntersectionObserver' in window && new IntersectionObserver(es => es.forEach(e => {
      if (e.intersectionRatio < 0.25 && e.target._stop && !e.target.classList.contains('fsx')) e.target._stop();
    }), { threshold: [0, 0.25] });

    // c: {label (מעל התמונה), name (לתוויות נגישות), base (שם קובץ בהורדה), img, vid, w, h, alt}
    function card(g, c) {
      const f = document.createElement('figure');
      /* טקסט לחיפוש: מספר, נוסח המודעה (זהה בתמונה ובסרטון) ובמודעה עם סרטון גם הטקסטים הקבועים שבסרטון */
      f.dataset.type = c.type || 'msg'; f.dataset.cat = c.cat || '';
      f.classList.toggle('tall', c.h / c.w > 1.5);   // 9:16: התמונה והסרטון ביחס האמיתי שלהם
      f.dataset.text = [c.label, c.name, c.alt, c.cr ? 'מוגן בזכויות יוצרים' : '', c.vid && c.type !== 'photo' && c.type !== 'anim' ? (c.type === 'move' ? 'להכניס תנועה חדשה לחיים' : 'מפגש מסוג אחר') + ' לגילאי ' + ageText('to') + ' בפרק פתוח בחיים הזמנה יוצאים להרפתקה' : ''].join(' ');
      const head = document.createElement('div'); head.className = 'head';
      const n = document.createElement('span'); n.className = 'n'; n.textContent = c.label;
      const ttl = document.createElement('div'); ttl.className = 'ttl'; ttl.appendChild(n);
      if (c.cr) { const w = document.createElement('span'); w.className = 'crw'; w.innerHTML = I_WARN + 'מוגן בזכויות יוצרים'; ttl.appendChild(w); }   // cr: מוזיקה מסחרית, במודעה ממומנת עלולה להיחסם
      head.appendChild(ttl);
      const media = document.createElement('div'); media.className = 'media';
      const im = document.createElement('img');
      im.loading = 'lazy'; im.width = c.w; im.height = c.h; im.src = c.img; im.alt = c.alt;
      media.appendChild(im); f.appendChild(head); f.appendChild(media);

      head.appendChild(moreMenu(c.name, c.base, c.img, c.vid));
      if (c.vid) {
        const v = document.createElement('video');
        v.playsInline = !FS_NATIVE; v.preload = 'none';
        v.width = c.w; v.height = c.h; v.poster = im.src; v.src = c.vid;
        v.style.backgroundImage = 'url("' + im.src + '")';   // בלי שחור: סרטון שקטן מהתא יושב על הרקע של התמונה
        v.setAttribute('aria-label', 'השהיה או המשך של ' + c.name);
        im.setAttribute('role', 'button'); im.tabIndex = 0; v.tabIndex = 0;
        im.setAttribute('aria-label', 'ניגון ' + c.name + ': ' + c.alt);
        // בקרת ניגון: סטופ (חזרה לתמונה), השהיה/המשך, מיקום בסרטון (גרירה) וזמן
        const ctl = document.createElement('div'); ctl.className = 'ctl'; ctl.dir = 'ltr';
        ctl.innerHTML = '<button type="button" class="cb stop">' + I_STOP + '</button><button type="button" class="cb pp">' + I_PAUSE + '</button>'
          + '<input class="seek" type="range" min="0" max="1000" step="1" value="0"><span class="tm">0:00</span>';
        const bStop = ctl.querySelector('.stop'), bPP = ctl.querySelector('.pp'), seek = ctl.querySelector('.seek'), tm = ctl.querySelector('.tm');
        bStop.setAttribute('aria-label', 'עצירה וחזרה לתמונה'); seek.setAttribute('aria-label', 'מיקום ב' + c.name);
        const fmt = s => Math.floor(s / 60) + ':' + String(Math.floor(s % 60)).padStart(2, '0');
        let dragging = false;
        const paint = () => {
          const d = v.duration || 0, k = d ? v.currentTime / d : 0;
          if (!dragging) seek.value = Math.round(k * 1000);
          seek.style.setProperty('--p', (seek.value / 10) + '%');
          tm.textContent = fmt(v.currentTime || 0);
        };
        const ppIcon = () => { bPP.innerHTML = v.paused ? I_PLAY : I_PAUSE; bPP.setAttribute('aria-label', v.paused ? 'המשך ניגון' : 'השהיה'); };
        const toggle = () => { if (v.paused) v.play().catch(() => {}); else v.pause(); };
        const show = on => {
          if (!on && media.classList.contains('fsx')) { v.pause(); fsSlideOut(media, () => { f.classList.remove('playing'); fsExit(media); }); return; }
          f.classList.toggle('playing', on);
          if (on) { v.currentTime = 0; paint(); v.play().catch(() => {}); v.focus({ preventScroll: true }); }
          else v.pause();
        };
        const start = () => { show(true); if (FS_MOBILE && !FS_NATIVE) fsEnter(media); };
        im.addEventListener('click', start);              // לחיצה על התמונה: ניגון
        v.addEventListener('click', toggle);              // לחיצה על הסרטון: השהיה / המשך
        im.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); start(); } });
        v.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); } });
        bPP.addEventListener('click', toggle);
        bStop.addEventListener('click', () => { show(false); im.focus({ preventScroll: true }); });   // סטופ: חזרה לתמונה
        seek.addEventListener('pointerdown', () => { dragging = true; });
        ['pointerup', 'pointercancel', 'change'].forEach(ev => seek.addEventListener(ev, () => { dragging = false; }));
        seek.addEventListener('input', () => { if (v.duration) v.currentTime = seek.value / 1000 * v.duration; paint(); });
        ['timeupdate', 'seeked', 'loadedmetadata'].forEach(ev => v.addEventListener(ev, paint));
        ['play', 'pause'].forEach(ev => v.addEventListener(ev, ppIcon));
        const pm = moreMenu(c.name, c.base, c.img, c.vid);   // ⋯ בנגן: אותו תפריט כמו בכרטיס. פתיחה משהה, וסגירה ממשיכה (אם הסרטון ניגן)
        let resume = false;
        pm.addEventListener('menuopen', () => { resume = !v.paused; v.pause(); });
        pm.addEventListener('menuclose', () => { if (resume && f.classList.contains('playing') && !media._out) v.play().catch(() => {}); resume = false; });
        ctl.appendChild(pm);
        media.appendChild(ctl);
        v.addEventListener('ended', () => show(false));   // בסוף הסרטון התא חוזר לתמונה
        const stop = () => { if (f.classList.contains('playing')) show(false); };
        stops.push(stop);
        v.addEventListener('webkitendfullscreen', stop);
        media._stop = stop; if (io) io.observe(media);
        v.addEventListener('play', () => stops.forEach(s => s !== stop && s()));
        f.classList.add('has-video'); media.appendChild(v);
        show(false);
      }
      g.appendChild(f);
    }

    FEATURED.forEach(c => card(document.getElementById('grid'), c));
    Promise.all([json('ads.json'), json('videos.json')]).then(([items, videos]) => {
      const g = document.getElementById('grid');
      (Array.isArray(items) ? items : []).forEach(it => {
        const pad = String(it.id).padStart(2, '0'), file = videos[String(it.id)];
        card(g, { label: it.id, name: 'מודעה ' + it.id, type: it.type, base: 'ad-' + pad, img: 'img/' + it.file, vid: file ? 'video/' + file : '',
          w: 1080, h: 1920, alt: it.text });
      });
      applySearch();
    });
    /* חיפוש: כל המילים שנכתבו חייבות להופיע (בלי ניקוד ופיסוק), על כל המודעות והסרטונים */
    const norm = s => String(s || '').toLowerCase().replace(/[֑-ׇ]/g, '').replace(/[^\p{L}\p{N}\s]/gu, ' ').replace(/\s+/g, ' ').trim();
    const qEl = document.getElementById('q'), qClr = document.getElementById('qClr'), typesEl = document.getElementById('types'), noneEl = document.getElementById('none');
    /* קטגוריות, לכל אחת כתובת משלה: ?c=dating, ?c=move, ?c=other-dating, ?c=other-move. בסרטונים המובילים cat: 'dating' = הכרויות, ובלי זה תנועה */
    const TYPE_LABELS = { '': 'הכל', dating: 'מסרים הכרויות', move: 'מסרים תנועה', 'other-dating': 'אחרים הכרויות', 'other-move': 'אחרים תנועה' };
    const catOf = f => f.dataset.type === 'msg' ? 'dating' : f.dataset.type === 'move' ? 'move' : f.dataset.cat === 'dating' ? 'other-dating' : 'other-move';
    let typeSel = new URLSearchParams(location.search).get('c') || '';
    if (!Object.hasOwn(TYPE_LABELS, typeSel)) typeSel = '';
    typesEl.value = typeSel;
    typesEl.addEventListener('change', e => {
      typeSel = e.target.value;
      const u = new URL(location.href);
      if (typeSel) u.searchParams.set('c', typeSel); else u.searchParams.delete('c');
      history.replaceState(null, '', u);
      applySearch();
    });
    function applySearch() {
      const words = norm(qEl.value).split(' ').filter(Boolean), count = { '': 0 };
      let shown = 0;
      document.querySelectorAll('#grid figure').forEach(f => {
        const hay = norm(f.dataset.text), match = words.every(w => hay.includes(w)), ok = match && (!typeSel || catOf(f) === typeSel);
        f.hidden = !ok; if (ok) shown++;
        if (match) { count[''] ++; count[catOf(f)] = (count[catOf(f)] || 0) + 1; }
        if (!ok) f.querySelector('.media') && f.querySelector('.media')._stop && f.querySelector('.media')._stop();
      });
      /* המספרים בתוך התפריט (לפי החיפוש הנוכחי), בלי להזיז את הפריסה */
      [...typesEl.options].forEach(o => { o.textContent = TYPE_LABELS[o.value] + ' (' + (count[o.value] || 0) + ')'; });
      qClr.hidden = !qEl.value;
      noneEl.hidden = shown > 0;
    }
    qEl.addEventListener('input', applySearch);
    qClr.addEventListener('click', () => { qEl.value = ''; applySearch(); qEl.focus(); });
  </script>
</body>
</html>
