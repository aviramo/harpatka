<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>תמונות למודעות</title>
  <link rel="icon" href="../images/favicon-v4.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="../images/favicon-v4-32.png" />
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&family=Assistant:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root{ --bg:#24201C; --ink:#EDE6DA; --terra:#C96F52; --paper:#FFFDF9; }
    *{ box-sizing:border-box; margin:0; }
    body{ background:var(--bg); color:var(--ink); }
    .grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(16rem,1fr)); gap:1rem; padding:1rem; }
    .grid figure{ display:block; }
    .grid .head{ display:flex; align-items:center; gap:.5rem; padding:0 .15rem .4rem; }
    .grid .n{ font-family:Rubik,Assistant,sans-serif; font-weight:600; font-size:.95rem; line-height:1; color:#A89F90; }
    /* הורדה: בצד שמאל, באותה שורה עם המספר. סרטון (אם יש) ואז תמונה */
    .grid .dl{ margin-inline-start:auto; display:flex; gap:.4rem; }
    .grid .dl a{ display:flex; align-items:center; gap:.2rem; height:2rem; padding:0 .55rem; border-radius:999px;
      border:1px solid rgba(168,159,144,.35); color:#A89F90; text-decoration:none; }
    .grid .dl svg{ width:1.05rem; height:1.05rem; display:block; fill:none; stroke:currentColor; stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round; }
    .grid .dl a:focus-visible{ outline:3px solid var(--paper); outline-offset:2px; }
    .grid .media{ position:relative; }
    .grid img, .grid video{ width:100%; height:auto; aspect-ratio:4/5; display:block; }
    .grid video{ display:none; background:#000; cursor:pointer; }
    /* מודעה עם סרטון: בלי כפתור. לחיצה על התמונה מנגנת את הסרטון באותו תא, לחיצה על הסרטון עוצרת וחוזרת לתמונה */
    .grid .has-video img{ cursor:pointer; }
    .grid .has-video img:focus-visible, .grid video:focus-visible{ outline:3px solid var(--paper); outline-offset:2px; }
    .grid .playing img{ display:none; }
    .grid .playing video{ display:block; }
  </style>
</head>
<body>
  <div id="grid" class="grid"></div>
  <script>
    // ads.json נבנה על ידי ads/tools/build_ads.py. videos.json (ידני): מספר סידורי של מודעה → קובץ ב-video/.
    const json = u => fetch(u).then(r => r.ok ? r.json() : {}).catch(() => ({}));
    const ARROW = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11M7 10.5l5 5 5-5M5 20h14"/></svg>';
    const GLYPH = {
      video: '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="6" width="13" height="12" rx="2.5"/><path d="M15.5 10.5l6-3.5v10l-6-3.5z"/></svg>',
      image: '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2.5"/><circle cx="9" cy="9.5" r="1.6"/><path d="M3.5 18l5.5-5.5 4 4 2.5-2.5 5 5"/></svg>'
    };
    const dlLink = (href, name, kind, label) => {
      const a = document.createElement('a');
      a.href = href; a.download = name; a.title = label; a.setAttribute('aria-label', label);
      a.innerHTML = ARROW + GLYPH[kind];
      return a;
    };
    Promise.all([json('ads.json'), json('videos.json')]).then(([items, videos]) => {
      const g = document.getElementById('grid');
      const stops = [];   // סרטון אחד בכל פעם: כשאחד מתחיל לנגן, כל השאר עוצרים וחוזרים לתמונה
      (Array.isArray(items) ? items : []).forEach(it => {
        const f = document.createElement('figure');
        const head = document.createElement('div'); head.className = 'head';
        const n = document.createElement('span'); n.className = 'n'; n.textContent = it.id;
        const dl = document.createElement('div'); dl.className = 'dl';
        head.appendChild(n); head.appendChild(dl);
        const media = document.createElement('div'); media.className = 'media';
        const im = document.createElement('img');
        im.loading = 'lazy'; im.width = 1080; im.height = 1350; im.src = 'img/' + it.file; im.alt = it.text;
        media.appendChild(im); f.appendChild(head); f.appendChild(media);

        const file = videos[String(it.id)];
        const pad = String(it.id).padStart(2, '0');
        if (file) dl.appendChild(dlLink('video/' + file, 'ad-' + pad + '.mp4', 'video', 'הורדת הסרטון של מודעה ' + it.id));
        dl.appendChild(dlLink('img/' + it.file, 'ad-' + pad + '.png', 'image', 'הורדת התמונה של מודעה ' + it.id));
        if (file) {
          const v = document.createElement('video');
          v.playsInline = true; v.preload = 'none';
          v.width = 1080; v.height = 1350; v.poster = im.src; v.src = 'video/' + file;
          v.setAttribute('aria-label', 'עצירת הסרטון של מודעה ' + it.id + ' וחזרה לתמונה');
          im.setAttribute('role', 'button'); im.tabIndex = 0; v.tabIndex = 0;
          im.setAttribute('aria-label', 'ניגון הסרטון של מודעה ' + it.id + ': ' + it.text);
          const show = on => {
            f.classList.toggle('playing', on);
            if (on) { v.currentTime = 0; v.play().catch(() => {}); v.focus({ preventScroll: true }); } else v.pause();
          };
          const key = on => e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); show(on); } };
          im.addEventListener('click', () => show(true));   // לחיצה על התמונה: ניגון
          v.addEventListener('click', () => show(false));   // לחיצה על הסרטון: עצירה וחזרה לתמונה
          im.addEventListener('keydown', key(true)); v.addEventListener('keydown', key(false));
          v.addEventListener('ended', () => show(false));   // בסוף הסרטון התא חוזר לתמונה
          const stop = () => { if (f.classList.contains('playing')) show(false); };
          stops.push(stop);
          v.addEventListener('play', () => stops.forEach(s => s !== stop && s()));
          f.classList.add('has-video'); media.appendChild(v);
          show(false);
        }
        g.appendChild(f);
      });
    });
  </script>
</body>
</html>
