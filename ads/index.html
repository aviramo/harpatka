<!doctype html>
<html lang="he" dir="rtl" class="pg-ads">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>מודעות</title>
  <link rel="icon" href="../images/favicon-v5.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="../images/favicon-v5-32.png" />
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&family=Assistant:wght@400;500;600;700&display=block" rel="stylesheet">
  <link rel="stylesheet" href="../shared/site.css?v=20261030b">
</head>
<body>
  <div class="ads-sticky">
  <div class="site-top">
    <div class="site-top-in">
      <a href="../" class="site-brand" aria-label="יוצאים להרפתקה, לדף הבית">יוצאים להרפתקה</a>
      <a href="../" class="site-back">חזרה לדף הבית</a>
    </div>
  </div>
  <div class="searchbar">
    <div class="box">
      <svg class="mag" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L20 20"/></svg>
      <input id="q" type="search" placeholder="חיפוש בטקסט המודעות (בתמונות ובסרטונים)" autocomplete="off" aria-label="חיפוש במודעות" />
      <button type="button" class="clr" id="qClr" aria-label="ניקוי החיפוש" hidden>×</button>
    </div>
    <select id="types" class="typesel" aria-label="סינון לפי סוג">
      <option value="">הכל</option>
      <option value="msg">מסרים</option>
      <option value="photo">תמונות</option>
      <option value="video">וידאו</option>
      <option value="anim">אנימציה</option>
    </select>
  </div>
  </div>
  <div id="grid" class="grid"></div>
  <div id="none" class="none" hidden>לא נמצאו מודעות עם הטקסט הזה</div>
  <script>
    // ads.json נבנה על ידי ads/tools/build_ads.py. videos.json (ידני): מספר סידורי של מודעה → קובץ ב-video/.
    const json = u => fetch(u).then(r => r.ok ? r.json() : {}).catch(() => ({}));
    const DOTS = '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>';
    const I_DL = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11M7 10.5l5 5 5-5M5 20h14"/></svg>';
    const I_STOP = '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>';
    const I_PLAY = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l10.5-6.5z"/></svg>';
    const I_PAUSE = '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6.5" y="5.5" width="4" height="13" rx="1"/><rect x="13.5" y="5.5" width="4" height="13" rx="1"/></svg>';
    const I_SHARE = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V4M7.5 8.5 12 4l4.5 4.5M5 12v6.5A1.5 1.5 0 0 0 6.5 20h11a1.5 1.5 0 0 0 1.5-1.5V12"/></svg>';

    const toastEl = document.createElement('div'); toastEl.className = 'toast'; toastEl.setAttribute('role', 'status');
    document.body.appendChild(toastEl);
    let toastT;
    const toast = msg => { toastEl.textContent = msg; toastEl.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => toastEl.classList.remove('on'), 2400); };

    // שיתוף: הקובץ עצמו (וואטסאפ, פייסבוק...) דרך תפריט השיתוף של המכשיר. הקובץ נטען כבר כשהתפריט נפתח,
    // כי navigator.share חייב לרוץ מיד אחרי הלחיצה. בלי שיתוף קבצים: שיתוף קישור, ואם גם זה לא קיים, העתקת הקישור.
    const files = {};
    const getFile = (url, name, type) => files[url] || (files[url] = fetch(url).then(r => r.ok ? r.blob() : Promise.reject(r.status))
      .then(b => new File([b], name, { type })).catch(e => { delete files[url]; throw e; }));
    async function share(url, name, type) {
      const abs = new URL(url, location.href).href;
      try {
        const file = await getFile(url, name, type);
        if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file] }); return; }
      } catch (e) {
        if (e && e.name === 'AbortError') return;   // תפריט השיתוף נסגר בלי שיתוף
        if (e && e.name === 'NotAllowedError') { toast('הקובץ מוכן, אפשר ללחוץ שוב על שיתוף'); return; }
      }
      if (navigator.share) { navigator.share({ url: abs }).catch(() => {}); return; }
      try { await navigator.clipboard.writeText(abs); toast('הקישור הועתק'); } catch (e) { window.prompt('הקישור לקובץ:', abs); }
    }

    let openMore = null;
    const closeMore = () => { if (openMore) { openMore.classList.remove('open'); openMore.querySelector('.dots').setAttribute('aria-expanded', 'false'); openMore = null; } };
    document.addEventListener('click', e => { if (openMore && !openMore.contains(e.target)) closeMore(); });
    document.addEventListener('keydown', e => { if (e.key === 'Escape' && openMore) { const b = openMore.querySelector('.dots'); closeMore(); b.focus(); } });

    // name: "מודעה 12" (לתוויות נגישות), base: שם הקבצים בהורדה ובשיתוף (ad-12.png / ad-12.mp4)
    function moreMenu(name, base, img, vid) {
      const ext = img.split('.').pop();
      const wrap = document.createElement('div'); wrap.className = 'more';
      const btn = document.createElement('button');
      btn.type = 'button'; btn.className = 'dots'; btn.innerHTML = DOTS;
      btn.setAttribute('aria-label', 'הורדה ושיתוף של ' + name); btn.setAttribute('aria-haspopup', 'menu'); btn.setAttribute('aria-expanded', 'false');
      const menu = document.createElement('div'); menu.className = 'menu'; menu.setAttribute('role', 'menu');
      // הסדר: שיתוף סרטון, הורדת סרטון, שיתוף תמונה, הורדת תמונה (בלי סרטון: רק התמונה)
      const kinds = [{ url: img, name: base + '.' + ext, type: ext === 'jpg' ? 'image/jpeg' : 'image/png', dl: 'הורדת תמונה', sh: 'שיתוף תמונה' }];
      if (vid) kinds.unshift({ url: vid, name: base + '.mp4', type: 'video/mp4', dl: 'הורדת סרטון', sh: 'שיתוף סרטון' });
      kinds.forEach((k, i) => {
        if (i) menu.appendChild(document.createElement('hr'));
        const a = document.createElement('a');
        a.href = k.url; a.download = k.name; a.setAttribute('role', 'menuitem'); a.innerHTML = I_DL + '<span>' + k.dl + '</span>';
        a.addEventListener('click', closeMore);
        const b = document.createElement('button');
        b.type = 'button'; b.setAttribute('role', 'menuitem'); b.innerHTML = I_SHARE + '<span>' + k.sh + '</span>';
        b.addEventListener('click', () => { closeMore(); share(k.url, k.name, k.type); });
        menu.appendChild(b); menu.appendChild(a);
      });
      btn.addEventListener('click', () => {
        if (openMore === wrap) { closeMore(); return; }
        closeMore(); wrap.classList.add('open'); btn.setAttribute('aria-expanded', 'true'); openMore = wrap;
        if (navigator.share) kinds.forEach(k => getFile(k.url, k.name, k.type).catch(() => {}));   // מוכן לשיתוף
      });
      wrap.appendChild(btn); wrap.appendChild(menu);
      return wrap;
    }

    // סרטונים שמופיעים ראשונים, לפני המודעות הממוספרות. סרטון מעודכן = שם קובץ חדש (cache)
    const ADV_ALT = 'מרגישים לפעמים שהחיים עומדים במקום? רוצים שמשהו ישתנה? אבל כל צעד מרגיש כמו מאמץ? ומה אם יש דרך אחרת? בלי להילחם בעצמכם. בלי להתאמץ כל כך. פשוט לשחק. לנוע. ליהנות. לפעמים דווקא ההנאה מניעה את השינוי. יוצאים להרפתקה, מכניסים תנועה לחיים. בואו לחוות את זה בעצמכם';
    const FEATURED = [{ label: 'מרגישים שהחיים עומדים במקום? (מוזיקה מלאה)', name: 'הסרטון מכניסים תנועה לחיים, גרסה עם מוזיקה מלאה', type: 'anim', base: 'adventure-full-music', w: 1080, h: 1350,
      img: 'img/adventure-830057d8.jpg', vid: 'video/adventure-full-4f9efb72.mp4', alt: ADV_ALT + ' מוזיקה מלאה' },
      { label: 'מרגישים שהחיים עומדים במקום?', name: 'הסרטון מכניסים תנועה לחיים', type: 'anim', base: 'adventure', w: 1080, h: 1350,
      img: 'img/adventure-830057d8.jpg', vid: 'video/adventure-830057d8.mp4',
      alt:'מרגישים לפעמים שהחיים עומדים במקום? רוצים שמשהו ישתנה? אבל כל צעד מרגיש כמו מאמץ? ומה אם יש דרך אחרת? בלי להילחם בעצמכם. בלי להתאמץ כל כך. פשוט לשחק. לנוע. ליהנות. לפעמים דווקא ההנאה מניעה את השינוי. יוצאים להרפתקה, מכניסים תנועה לחיים. בואו לחוות את זה בעצמכם' },
      { label: 'משניים למעגל', name: 'הסרטון משניים למעגל', type: 'video', base: 'motion-group', w: 1080, h: 1350,
      img: 'img/motion-group-07f01b9a.jpg', vid: 'video/motion-group-541fbd68.mp4',
      alt: 'מתי בפעם האחרונה חייכו אליכם בלי מילים? מתי רקדתם בלי לחשוב? מתי הרגשתם חיבור עם כולם? מתי יצאתם ביחד לדרך משותפת והרגשתם בבית? ביודנסה. יוצאים להרפתקה, מפגש מסוג אחר. להיות, לנוע, להיפגש' },
      { label: 'עוד סוויפ?', name: 'הסרטון עוד סוויפ', type: 'photo', base: 'sweeps', w: 1080, h: 1350,
      img: 'img/sweeps-4ef8b1dd.jpg', vid: 'video/sweeps-4ef8b1dd.mp4', alt: 'עוד סוויפ? מרימים את המבט, מתחילים לנוע. יוצאים להרפתקה: מפגש דרך מוזיקה, תנועה וחיבור' },
      { label: 'יש רגעים שמפספסים', name: 'הסרטון יש רגעים שמפספסים', type: 'photo', base: 'biodanza', w: 1080, h: 1350,
      img: 'img/biodanza-feed-cfba800c.jpg', vid: 'video/biodanza-feed-cfba800c.mp4', alt: 'יש רגעים שמפספסים. ויש רגעים שבוחרים להיות בהם. יוצאים להרפתקה: להיות, לנוע, להיפגש' }];

    const stops = [];   // סרטון אחד בכל פעם: כשאחד מתחיל לנגן, כל השאר עוצרים וחוזרים לתמונה
    // גלילה: סרטון שיוצא מהמסך (נשאר ממנו פחות מרבע) נעצר וחוזר לתמונה
    const io = 'IntersectionObserver' in window && new IntersectionObserver(es => es.forEach(e => {
      if (e.intersectionRatio < 0.25 && e.target._stop) e.target._stop();
    }), { threshold: [0, 0.25] });

    // c: {label (מעל התמונה), name (לתוויות נגישות), base (שם קובץ בהורדה), img, vid, w, h, alt}
    function card(g, c) {
      const f = document.createElement('figure');
      /* טקסט לחיפוש: מספר, נוסח המודעה (זהה בתמונה ובסרטון) ובמודעה עם סרטון גם הטקסטים הקבועים שבסרטון */
      f.dataset.type = c.type || 'msg';
      f.dataset.text = [c.label, c.name, c.alt, c.vid && c.type !== 'photo' && c.type !== 'anim' ?'מפגש מסוג אחר לגילאי 40 עד 50 בפרק פתוח בחיים הזמנה יוצאים להרפתקה' : ''].join(' ');
      const head = document.createElement('div'); head.className = 'head';
      const n = document.createElement('span'); n.className = 'n'; n.textContent = c.label;
      head.appendChild(n);
      const media = document.createElement('div'); media.className = 'media';
      const im = document.createElement('img');
      im.loading = 'lazy'; im.width = c.w; im.height = c.h; im.src = c.img; im.alt = c.alt;
      media.appendChild(im); f.appendChild(head); f.appendChild(media);

      head.appendChild(moreMenu(c.name, c.base, c.img, c.vid));
      if (c.vid) {
        const v = document.createElement('video');
        v.playsInline = true; v.preload = 'none';
        v.width = c.w; v.height = c.h; v.poster = im.src; v.src = c.vid;
        v.setAttribute('aria-label', 'השהיה או המשך של ' + c.name);
        im.setAttribute('role', 'button'); im.tabIndex = 0; v.tabIndex = 0;
        im.setAttribute('aria-label', 'ניגון ' + c.name + ': ' + c.alt);
        // בקרת ניגון: סטופ (חזרה לתמונה), השהיה/המשך, מיקום בסרטון (גרירה) וזמן
        const ctl = document.createElement('div'); ctl.className = 'ctl'; ctl.dir = 'ltr';
        ctl.innerHTML = '<button type="button" class="cb stop">' + I_STOP + '</button><button type="button" class="cb pp">' + I_PAUSE + '</button>'
          + '<input class="seek" type="range" min="0" max="1000" step="1" value="0"><span class="tm">0:00</span>';
        const bStop = ctl.querySelector('.stop'), bPP = ctl.querySelector('.pp'), seek = ctl.querySelector('.seek'), tm = ctl.querySelector('.tm');
        bStop.setAttribute('aria-label', 'עצירה וחזרה לתמונה'); seek.setAttribute('aria-label', 'מיקום ב' + c.name);
        const fmt = s => Math.floor(s / 60) + ':' + String(Math.floor(s % 60)).padStart(2, '0');
        let dragging = false;
        const paint = () => {
          const d = v.duration || 0, k = d ? v.currentTime / d : 0;
          if (!dragging) seek.value = Math.round(k * 1000);
          seek.style.setProperty('--p', (seek.value / 10) + '%');
          tm.textContent = fmt(v.currentTime || 0);
        };
        const ppIcon = () => { bPP.innerHTML = v.paused ? I_PLAY : I_PAUSE; bPP.setAttribute('aria-label', v.paused ? 'המשך ניגון' : 'השהיה'); };
        const toggle = () => { if (v.paused) v.play().catch(() => {}); else v.pause(); };
        const show = on => {
          f.classList.toggle('playing', on);
          if (on) { v.currentTime = 0; paint(); v.play().catch(() => {}); v.focus({ preventScroll: true }); } else v.pause();
        };
        im.addEventListener('click', () => show(true));   // לחיצה על התמונה: ניגון
        v.addEventListener('click', toggle);              // לחיצה על הסרטון: השהיה / המשך
        im.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); show(true); } });
        v.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); } });
        bPP.addEventListener('click', toggle);
        bStop.addEventListener('click', () => { show(false); im.focus({ preventScroll: true }); });   // סטופ: חזרה לתמונה
        seek.addEventListener('pointerdown', () => { dragging = true; });
        ['pointerup', 'pointercancel', 'change'].forEach(ev => seek.addEventListener(ev, () => { dragging = false; }));
        seek.addEventListener('input', () => { if (v.duration) v.currentTime = seek.value / 1000 * v.duration; paint(); });
        ['timeupdate', 'seeked', 'loadedmetadata'].forEach(ev => v.addEventListener(ev, paint));
        ['play', 'pause'].forEach(ev => v.addEventListener(ev, ppIcon));
        media.appendChild(ctl);
        v.addEventListener('ended', () => show(false));   // בסוף הסרטון התא חוזר לתמונה
        const stop = () => { if (f.classList.contains('playing')) show(false); };
        stops.push(stop);
        media._stop = stop; if (io) io.observe(media);
        v.addEventListener('play', () => stops.forEach(s => s !== stop && s()));
        f.classList.add('has-video'); media.appendChild(v);
        show(false);
      }
      g.appendChild(f);
    }

    FEATURED.forEach(c => card(document.getElementById('grid'), c));
    Promise.all([json('ads.json'), json('videos.json')]).then(([items, videos]) => {
      const g = document.getElementById('grid');
      (Array.isArray(items) ? items : []).forEach(it => {
        const pad = String(it.id).padStart(2, '0'), file = videos[String(it.id)];
        card(g, { label: it.id, name: 'מודעה ' + it.id, base: 'ad-' + pad, img: 'img/' + it.file, vid: file ? 'video/' + file : '',
          w: 1080, h: 1350, alt: it.text });
      });
      applySearch();
    });
    /* חיפוש: כל המילים שנכתבו חייבות להופיע (בלי ניקוד ופיסוק), על כל המודעות והסרטונים */
    const norm = s => String(s || '').toLowerCase().replace(/[֑-ׇ]/g, '').replace(/[^\p{L}\p{N}\s]/gu, ' ').replace(/\s+/g, ' ').trim();
    const qEl = document.getElementById('q'), qClr = document.getElementById('qClr'), typesEl = document.getElementById('types'), noneEl = document.getElementById('none');
    let typeSel = '';
    document.getElementById('types').addEventListener('change', e => { typeSel = e.target.value; applySearch(); });
    const TYPE_LABELS = { '': 'הכל', msg: 'מסרים', photo: 'תמונות', video: 'וידאו', anim: 'אנימציה' };
    function applySearch() {
      const words = norm(qEl.value).split(' ').filter(Boolean), count = { '': 0, msg: 0, photo: 0, video: 0 };
      let shown = 0;
      document.querySelectorAll('#grid figure').forEach(f => {
        const hay = norm(f.dataset.text), match = words.every(w => hay.includes(w)), ok = match && (!typeSel || f.dataset.type === typeSel);
        f.hidden = !ok; if (ok) shown++;
        if (match) { count[''] ++; count[f.dataset.type] = (count[f.dataset.type] || 0) + 1; }
        if (!ok) f.querySelector('.media') && f.querySelector('.media')._stop && f.querySelector('.media')._stop();
      });
      /* המספרים בתוך התפריט (לפי החיפוש הנוכחי), בלי להזיז את הפריסה */
      [...typesEl.options].forEach(o => { o.textContent = TYPE_LABELS[o.value] + ' (' + (count[o.value] || 0) + ')'; });
      qClr.hidden = !qEl.value;
      noneEl.hidden = shown > 0;
    }
    qEl.addEventListener('input', applySearch);
    qClr.addEventListener('click', () => { qEl.value = ''; applySearch(); qEl.focus(); });
  </script>
</body>
</html>
