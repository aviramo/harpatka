<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>מודעות</title>
  <link rel="icon" href="../images/favicon-v4.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="../images/favicon-v4-32.png" />
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&family=Assistant:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root{ --bg:#24201C; --ink:#EDE6DA; --terra:#C96F52; --paper:#FFFDF9; }
    *{ box-sizing:border-box; margin:0; }
    body{ background:var(--bg); color:var(--ink); }
    .grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(16rem,1fr)); gap:1rem; padding:1rem; }
    .grid figure{ display:block; }
    .grid .head{ display:flex; align-items:center; gap:.5rem; padding:0 .15rem .4rem; }
    .grid .n{ font-family:Rubik,Assistant,sans-serif; font-weight:600; font-size:.95rem; line-height:1; color:#A89F90; }
    /* ⋯ בצד שמאל, באותה שורה עם המספר: תפריט הורדה ושיתוף של התמונה והסרטון (אם יש) */
    .grid .more{ position:relative; margin-inline-start:auto; }
    .grid .dots{ width:2.4rem; height:2rem; display:grid; place-items:center; padding:0; cursor:pointer;
      border:1px solid rgba(168,159,144,.35); border-radius:999px; background:none; color:#A89F90; }
    .grid .dots svg{ width:1.25rem; height:1.25rem; display:block; fill:currentColor; }
    .grid .menu{ display:none; position:absolute; top:calc(100% + .35rem); left:0; z-index:20; min-width:11.5rem; padding:.35rem;
      background:var(--paper); color:#3F382F; border-radius:14px; box-shadow:0 10px 28px rgba(0,0,0,.38); }
    .grid .more.open .menu{ display:block; }
    .grid .menu a, .grid .menu button{ display:flex; align-items:center; gap:.6rem; width:100%; padding:.6rem .7rem; border:0; border-radius:10px;
      background:none; color:inherit; font:600 1rem Assistant,Rubik,sans-serif; text-decoration:none; text-align:start; cursor:pointer; }
    .grid .menu a:hover, .grid .menu button:hover{ background:#F4ECE0; }
    .grid .menu svg{ width:1.15rem; height:1.15rem; flex:none; fill:none; stroke:var(--terra); stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round; }
    .grid .menu hr{ border:0; border-top:1px solid #EDE3D3; margin:.3rem .5rem; }
    .grid .dots:focus-visible, .grid .menu :focus-visible{ outline:3px solid var(--terra); outline-offset:1px; }
    .toast{ position:fixed; left:50%; bottom:1.4rem; transform:translateX(-50%); z-index:50; padding:.65rem 1.1rem; border-radius:999px;
      background:var(--paper); color:#3F382F; font:600 1rem Assistant,Rubik,sans-serif; box-shadow:0 6px 20px rgba(0,0,0,.35); opacity:0; transition:opacity .2s; pointer-events:none; }
    .toast.on{ opacity:1; }
    .grid .media{ position:relative; }
    .grid img, .grid video{ width:100%; height:auto; aspect-ratio:4/5; display:block; }
    .grid video{ display:none; background:#000; cursor:pointer; }
    /* מודעה עם סרטון: בלי כפתור. לחיצה על התמונה מנגנת את הסרטון באותו תא, לחיצה על הסרטון עוצרת וחוזרת לתמונה */
    .grid .has-video img{ cursor:pointer; }
    .grid .has-video img:focus-visible, .grid video:focus-visible{ outline:3px solid var(--paper); outline-offset:2px; }
    .grid .playing img{ display:none; }
    .grid .playing video{ display:block; }
  </style>
</head>
<body>
  <div id="grid" class="grid"></div>
  <script>
    // ads.json נבנה על ידי ads/tools/build_ads.py. videos.json (ידני): מספר סידורי של מודעה → קובץ ב-video/.
    const json = u => fetch(u).then(r => r.ok ? r.json() : {}).catch(() => ({}));
    const DOTS = '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>';
    const I_DL = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11M7 10.5l5 5 5-5M5 20h14"/></svg>';
    const I_SHARE = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V4M7.5 8.5 12 4l4.5 4.5M5 12v6.5A1.5 1.5 0 0 0 6.5 20h11a1.5 1.5 0 0 0 1.5-1.5V12"/></svg>';

    const toastEl = document.createElement('div'); toastEl.className = 'toast'; toastEl.setAttribute('role', 'status');
    document.body.appendChild(toastEl);
    let toastT;
    const toast = msg => { toastEl.textContent = msg; toastEl.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => toastEl.classList.remove('on'), 2400); };

    // שיתוף: הקובץ עצמו (וואטסאפ, פייסבוק...) דרך תפריט השיתוף של המכשיר. הקובץ נטען כבר כשהתפריט נפתח,
    // כי navigator.share חייב לרוץ מיד אחרי הלחיצה. בלי שיתוף קבצים: שיתוף קישור, ואם גם זה לא קיים, העתקת הקישור.
    const files = {};
    const getFile = (url, name, type) => files[url] || (files[url] = fetch(url).then(r => r.ok ? r.blob() : Promise.reject(r.status))
      .then(b => new File([b], name, { type })).catch(e => { delete files[url]; throw e; }));
    async function share(url, name, type) {
      const abs = new URL(url, location.href).href;
      try {
        const file = await getFile(url, name, type);
        if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file] }); return; }
      } catch (e) {
        if (e && e.name === 'AbortError') return;   // תפריט השיתוף נסגר בלי שיתוף
        if (e && e.name === 'NotAllowedError') { toast('הקובץ מוכן, אפשר ללחוץ שוב על שיתוף'); return; }
      }
      if (navigator.share) { navigator.share({ url: abs }).catch(() => {}); return; }
      try { await navigator.clipboard.writeText(abs); toast('הקישור הועתק'); } catch (e) { window.prompt('הקישור לקובץ:', abs); }
    }

    let openMore = null;
    const closeMore = () => { if (openMore) { openMore.classList.remove('open'); openMore.querySelector('.dots').setAttribute('aria-expanded', 'false'); openMore = null; } };
    document.addEventListener('click', e => { if (openMore && !openMore.contains(e.target)) closeMore(); });
    document.addEventListener('keydown', e => { if (e.key === 'Escape' && openMore) { const b = openMore.querySelector('.dots'); closeMore(); b.focus(); } });

    function moreMenu(id, img, vid) {
      const pad = String(id).padStart(2, '0');
      const wrap = document.createElement('div'); wrap.className = 'more';
      const btn = document.createElement('button');
      btn.type = 'button'; btn.className = 'dots'; btn.innerHTML = DOTS;
      btn.setAttribute('aria-label', 'הורדה ושיתוף של מודעה ' + id); btn.setAttribute('aria-haspopup', 'menu'); btn.setAttribute('aria-expanded', 'false');
      const menu = document.createElement('div'); menu.className = 'menu'; menu.setAttribute('role', 'menu');
      // הסדר: שיתוף סרטון, הורדת סרטון, שיתוף תמונה, הורדת תמונה (בלי סרטון: רק התמונה)
      const kinds = [{ url: img, name: 'ad-' + pad + '.png', type: 'image/png', dl: 'הורדת תמונה', sh: 'שיתוף תמונה' }];
      if (vid) kinds.unshift({ url: vid, name: 'ad-' + pad + '.mp4', type: 'video/mp4', dl: 'הורדת סרטון', sh: 'שיתוף סרטון' });
      kinds.forEach((k, i) => {
        if (i) menu.appendChild(document.createElement('hr'));
        const a = document.createElement('a');
        a.href = k.url; a.download = k.name; a.setAttribute('role', 'menuitem'); a.innerHTML = I_DL + '<span>' + k.dl + '</span>';
        a.addEventListener('click', closeMore);
        const b = document.createElement('button');
        b.type = 'button'; b.setAttribute('role', 'menuitem'); b.innerHTML = I_SHARE + '<span>' + k.sh + '</span>';
        b.addEventListener('click', () => { closeMore(); share(k.url, k.name, k.type); });
        menu.appendChild(b); menu.appendChild(a);
      });
      btn.addEventListener('click', () => {
        if (openMore === wrap) { closeMore(); return; }
        closeMore(); wrap.classList.add('open'); btn.setAttribute('aria-expanded', 'true'); openMore = wrap;
        if (navigator.share) kinds.forEach(k => getFile(k.url, k.name, k.type).catch(() => {}));   // מוכן לשיתוף
      });
      wrap.appendChild(btn); wrap.appendChild(menu);
      return wrap;
    }
    Promise.all([json('ads.json'), json('videos.json')]).then(([items, videos]) => {
      const g = document.getElementById('grid');
      const stops = [];   // סרטון אחד בכל פעם: כשאחד מתחיל לנגן, כל השאר עוצרים וחוזרים לתמונה
      // גלילה: סרטון שיוצא מהמסך (נשאר ממנו פחות מרבע) נעצר וחוזר לתמונה
      const io = 'IntersectionObserver' in window && new IntersectionObserver(es => es.forEach(e => {
        if (e.intersectionRatio < 0.25 && e.target._stop) e.target._stop();
      }), { threshold: [0, 0.25] });
      (Array.isArray(items) ? items : []).forEach(it => {
        const f = document.createElement('figure');
        const head = document.createElement('div'); head.className = 'head';
        const n = document.createElement('span'); n.className = 'n'; n.textContent = it.id;
        head.appendChild(n);
        const media = document.createElement('div'); media.className = 'media';
        const im = document.createElement('img');
        im.loading = 'lazy'; im.width = 1080; im.height = 1350; im.src = 'img/' + it.file; im.alt = it.text;
        media.appendChild(im); f.appendChild(head); f.appendChild(media);

        const file = videos[String(it.id)];
        head.appendChild(moreMenu(it.id, 'img/' + it.file, file ? 'video/' + file : ''));
        if (file) {
          const v = document.createElement('video');
          v.playsInline = true; v.preload = 'none';
          v.width = 1080; v.height = 1350; v.poster = im.src; v.src = 'video/' + file;
          v.setAttribute('aria-label', 'עצירת הסרטון של מודעה ' + it.id + ' וחזרה לתמונה');
          im.setAttribute('role', 'button'); im.tabIndex = 0; v.tabIndex = 0;
          im.setAttribute('aria-label', 'ניגון הסרטון של מודעה ' + it.id + ': ' + it.text);
          const show = on => {
            f.classList.toggle('playing', on);
            if (on) { v.currentTime = 0; v.play().catch(() => {}); v.focus({ preventScroll: true }); } else v.pause();
          };
          const key = on => e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); show(on); } };
          im.addEventListener('click', () => show(true));   // לחיצה על התמונה: ניגון
          v.addEventListener('click', () => show(false));   // לחיצה על הסרטון: עצירה וחזרה לתמונה
          im.addEventListener('keydown', key(true)); v.addEventListener('keydown', key(false));
          v.addEventListener('ended', () => show(false));   // בסוף הסרטון התא חוזר לתמונה
          const stop = () => { if (f.classList.contains('playing')) show(false); };
          stops.push(stop);
          media._stop = stop; if (io) io.observe(media);
          v.addEventListener('play', () => stops.forEach(s => s !== stop && s()));
          f.classList.add('has-video'); media.appendChild(v);
          show(false);
        }
        g.appendChild(f);
      });
    });
  </script>
</body>
</html>
