<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow" />
<title>שליחת הודעות</title>
<style>
:root{--bg:#FFF5E8;--ink:#2C231D;--muted:#7a6a5c;--line:#e6d6c2;--green:#4E7D2C;--terra:#C8411B;--paper:#FFFDF9}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Assistant,system-ui,sans-serif}
header{position:sticky;top:0;background:var(--bg);padding:12px 16px;border-bottom:1px solid var(--line);z-index:2}
h1{margin:0 0 4px;font-size:1.15rem}
.sub{font-size:.85rem;color:var(--muted)}
.bar{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap}
select,button{font:inherit}
.app{border:1px solid var(--line);background:var(--paper);padding:6px 8px;border-radius:6px;color:var(--ink)}
ul{list-style:none;margin:0;padding:0 0 28px}
li a{display:flex;align-items:center;gap:12px;min-height:56px;padding:8px 16px;border-bottom:1px solid var(--line);text-decoration:none;color:var(--ink)}
li a:active{background:#f6e7d2}
.nm{flex:1;min-width:0;font-weight:600;font-size:1.05rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ph{color:var(--muted);font-size:.9rem;direction:ltr}
.ck{width:28px;height:28px;border:1px solid var(--line);border-radius:6px;display:grid;place-items:center;color:#fff;font-weight:700}
li.done .ck{background:var(--green);border-color:var(--green)}
li.done .nm{color:var(--muted)}
#gate{padding:32px 16px;max-width:24rem;margin:auto}
#gate input{width:100%;padding:12px;font-size:1rem;border:1px solid var(--line);background:var(--paper);border-radius:6px;direction:ltr;text-align:left}
#gate button{margin-top:12px;width:100%;padding:12px;border:0;background:var(--terra);color:#fff;border-radius:6px;font-weight:700}
#err{color:var(--terra);margin-top:8px;min-height:1.2em}
.reset{background:none;border:0;color:var(--muted);text-decoration:underline;padding:0}
</style>
</head>
<body>
<div id="gate">
  <h1>שליחת הודעות</h1>
  <p class="sub">הרשימה מוצפנת. הקלידו את הסיסמה</p>
  <input id="pw" type="password" autocomplete="off" autofocus />
  <button id="go">כניסה</button>
  <div id="err"></div>
</div>
<div id="app" hidden>
  <header>
    <h1>שליחת הודעת וואטסאפ</h1>
    <div class="sub"><span id="cnt"></span> · לחיצה על שם פותחת וואטסאפ עם ההודעה מוכנה</div>
    <div class="bar">
      <select id="appSel" class="app" aria-label="אפליקציית וואטסאפ"><option value="biz">וואטסאפ עסקי</option><option value="reg">וואטסאפ רגיל</option></select>
      <button class="reset" id="reset">ניקוי סימוני ״נשלח״</button>
    </div>
  </header>
  <ul id="list"></ul>
</div>

var MSG = "היי, מה שלומך?\nרציתי לשאול אם יצא לך לראות שיש לנו מפגש במוצאי שבת הקרוב? חשבתי שאולי יעניין אותך להצטרף 😊\n\nhttps://harpatka.co.il";
var UA = navigator.userAgent, ANDROID = /Android/i.test(UA), IOS = /iPhone|iPad|iPod/i.test(UA);
var PKG = { biz: 'com.whatsapp.w4b', reg: 'com.whatsapp' };
function ls(k, v){ try { if (v === undefined) return localStorage.getItem(k); if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) {} return null; }
function waNum(p){ var n = p.replace(/\D/g, ''); return n.charAt(0) === '0' ? '972' + n.slice(1) : n; }
function link(p, app){
  var n = waNum(p), t = encodeURIComponent(MSG), web = 'https://wa.me/' + n + '?text=' + t, q = 'send?phone=' + n + '&text=' + t;
  if (ANDROID) return 'intent://' + q + '#Intent;scheme=whatsapp;package=' + PKG[app] + ';S.browser_fallback_url=' + encodeURIComponent(web) + ';end';
  if (IOS && app === 'biz') return 'whatsapp-smb://' + q;
  return web;
}
function local(p){ return p.charAt(0) === '+' ? p : p.replace(/^(\d{3})(\d{3})(\d{4})$/, '$1-$2-$3'); }
function b64(s){ var b = atob(s), a = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) a[i] = b.charCodeAt(i); return a; }
async function decrypt(pass){
  var raw = b64(BLOB), salt = raw.slice(0, 16), iv = raw.slice(16, 28), ct = raw.slice(28);
  var km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
  var key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: salt, iterations: 200000, hash: 'SHA-256' }, km, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: iv }, key, ct)));
}
var DATA = [], appSel = document.getElementById('appSel');
appSel.value = ls('wa_app') || 'biz';
appSel.onchange = function(){ ls('wa_app', appSel.value); render(); };
function done(){ try { return JSON.parse(ls('wa_done') || '{}'); } catch (e) { return {}; } }
function render(){
  var d = done(), app = appSel.value, list = document.getElementById('list');
  list.innerHTML = '';
  DATA.forEach(function(r){
    var li = document.createElement('li'), a = document.createElement('a');
    var isDone = !!d[r[1]]; if (isDone) return;
    a.href = link(r[1], app);
    if (!ANDROID && !IOS) { a.target = '_blank'; a.rel = 'noopener'; }
    a.innerHTML = '<span class="nm"></span><span class="ph"></span><span class="ck">' + (isDone ? '✓' : '') + '</span>';
    a.children[0].textContent = r[0] || local(r[1]);
    a.children[1].textContent = r[0] ? local(r[1]) : '';
    a.onclick = function(){ var x = done(); x[r[1]] = 1; ls('wa_done', JSON.stringify(x)); setTimeout(function(){ li.hidden = true; }, 400); count(); };
    li.appendChild(a); list.appendChild(li);
  });
  count();
}
function count(){ var d = done(), n = DATA.filter(function(r){ return d[r[1]]; }).length; document.getElementById('cnt').textContent = 'נשלחו ' + n + ' מתוך ' + DATA.length; }
document.getElementById('reset').onclick = function(){ if (confirm('לנקות את כל הסימונים?')) { ls('wa_done', null); render(); } };
async function enter(pass, silent){
  try { DATA = await decrypt(pass); }
  catch (e) { if (!silent) document.getElementById('err').textContent = 'סיסמה שגויה'; return false; }
  ls('wa_pass', pass);
  document.getElementById('gate').hidden = true; document.getElementById('app').hidden = false; render(); return true;
}
document.getElementById('go').onclick = function(){ enter(document.getElementById('pw').value.trim()); };
document.getElementById('pw').onkeydown = function(e){ if (e.key === 'Enter') document.getElementById('go').click(); };
(async function(){
  var h = decodeURIComponent((location.hash || '').slice(1));
  if (h) { history.replaceState(null, '', location.pathname + location.search); if (await enter(h, true)) return; }
  var s = ls('wa_pass'); if (s) await enter(s, true);
})();
