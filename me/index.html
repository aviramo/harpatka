(() => {

    const ordered = ms.slice().sort((a, b) => (String(b.date) + String(b.time)).localeCompare(String(a.date) + String(a.time))), upcoming = ordered.filter((m) => m.future);   // מהחדש לישן
    const firstId = keepOpen && ordered.some((m) => m.id === keepOpen) ? keepOpen : null; keepOpen = null;   // אין מפגש פתוח כברירת מחדל; רק מפגש שהרגע נרשמו אליו או ביטלו נשאר פתוח
    /* שורת מפגש קבועה (בלי פתיחה וסגירה): מימין יום, תאריך ושעה ומתחתיהם עיר ושם המפגש; משמאל מצב ההגעה ומתחתיו התשלום (עם הסכום);
       כשצריך לשלם: כפתור תשלום גדול בפייבוקס כמו בפופאפ ההרשמה (הלחיצה מדווחת על תשלום) ו"רוצים לשלם בדרך אחרת?"; בלי הוראות הגעה */
    const rowHtml = (m) => {
      const paid = Number(m.paid) > 0, free = !!m.free;
      const att = m.future ? '' : (m.attended ? '<span class="chip ok">הגעתם</span>' : '<span class="chip">לא הגעתם</span>');
      const pay = free ? '<span class="chip">חינם</span>' : paid ? '<span class="chip ok">שולם ' + ils(m.paid) + '</span>'
        : !m.future ? '<span class="chip no">לא שולם</span>'
        : m.reported ? '<span class="chip wait">ממתין לאישור תשלום</span>'
        : m.rejected ? '<span class="chip no">התשלום לא אושר</span>' : '<span class="chip no">טרם שולם</span>';
      let foot = '';
      if (m.future && !paid && !free && !m.reported && CFG.payboxLink) foot += '<div class="payfold" data-pf="' + m.id + '"><div><a class="btn pay" data-paynow="' + m.id + '" href="' + esc(CFG.payboxLink) + '" target="_blank" rel="noopener">לתשלום ' + (m.price ? m.price + ' ₪ ' : '') + 'בפייבוקס</a><div class="paylinks"><button type="button" class="lnk" data-other="' + m.id + '">רוצים לשלם בדרך אחרת?</button></div><div class="msg" data-pm="' + m.id + '"></div></div></div>';
      if (m.future && !m.attended) foot += '<button type="button" class="lnk sm" data-unreg="' + m.id + '">ביטול רישום</button><div class="msg" data-um="' + m.id + '"></div>';
      return '<div class="mtg" data-mid="' + m.id + '"><div class="mtrow"><div class="mtw"><div class="mtd"><span class="c1">' + esc(dayParts(m.date).day) + '</span><bdi dir="ltr">' + esc(m.time) + ' · ' + esc(dayParts(m.date).date) + '</bdi></div><div class="c5">' + esc([m.city, m.name].filter(Boolean).join(' · ')) + '</div></div><div class="mts">' + att + pay + '</div></div>' + (foot ? '<div class="mtfoot">' + foot + '</div>' : '') + '</div>';
    };
    // רק המפגשים שנרשמתי אליהם (מהחדש לישן); הרשמה למפגש חדש נעשית מדף הבית
    const mine = ordered.filter((m) => m.registered);
    const meetHtml = '<div class="card mlist">' + (mine.length ? mine.map(rowHtml).join('') : '<p class="muted" style="margin:14px 0">עוד לא נרשמתם לאף מפגש</p>') + '</div>';   // בלי כותרת: הכרטיס הוא רשימת המפגשים בלבד

    const gv = p.gender || '';
    const missing = !p.gender || p.age == null || keepDetOpen;   // חסר פרט חובה: הכרטיס נפתח מעצמו
    h += '<div class="card" id="detCard"><button type="button" class="dethead" id="detHead" aria-expanded="' + missing + '" aria-controls="detBody"><h2>הפרטים שלי</h2><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button><div class="detfold' + (missing ? ' open' : '') + '" id="detBody"><div><div class="two"><div>' + PersonForm.html('first', { id: 'fn', label: true, value: p.first_name }) + '</div><div>' + PersonForm.html('last', { id: 'ln', label: true, value: p.last_name }) + '</div></div>' + PersonForm.err('name') +
      PersonForm.html('phone', { id: 'ph2', label: true, value: String(p.phone || '').replace(/^\+972/, '0'), attr: 'style="text-align:right"' }) + PersonForm.err('phone') +
      '<div class="two"><div>' + PersonForm.html('age', { id: 'ag', label: true, value: p.age }) + PersonForm.err('age') + '</div><div>' + PersonForm.html('gender', { id: 'gn', label: true, value: gv }) + PersonForm.err('gender') + '</div></div>' +
      '<button type="button" class="btn" id="saveBtn">שמירה</button><div class="msg" id="sm"></div></div></div></div>';
    h += meetHtml;   // "הפרטים שלי" ראשון, ומתחתיו רשימת המפגשים
    keepOpenSet = new Set(); keepDetOpen = false;
    app.innerHTML = h;
    if (scrollTo) { const row = app.querySelector('.mtg[data-mid="' + scrollTo + '"]'); scrollTo = null; if (row) setTimeout(() => row.scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'start' }), 120); }

    app.querySelectorAll('[data-reg]').forEach((rb) => { rb.onclick = async () => {
      const id = rb.dataset.reg, msg = app.querySelector('[data-rm="' + id + '"]'); rb.disabled = true;
      const ob = meOpt(id, { registered: true }), rel = HRT.busy(rb);
      try { const r = await rpc('harpatka_me_register', Object.assign({ p_meeting: id }, imp ? { p_as: asId } : {})); rel(); if (r === 'registered' || r === 'exists') { ob.done(); keepOpen = id; load(); } else { ob.fail(); toast(msg, 'אי אפשר להירשם למפגש הזה', true); rb.disabled = false; } }
      catch (e) { rel(); ob.fail(); toast(msg, 'משהו השתבש, אפשר לנסות שוב', true); rb.disabled = false; }
    }; });
    app.querySelectorAll('[data-unreg]').forEach((ub) => { ub.onclick = async () => {   // שני שלבים: לחיצה ראשונה מבקשת אישור
      const id = ub.dataset.unreg, msg = app.querySelector('[data-um="' + id + '"]');
      if (!ub.dataset.sure) { ub.dataset.sure = '1'; ub.textContent = 'לחיצה נוספת לאישור ביטול הרישום'; return; }
      ub.disabled = true;
      const ob = meOpt(id, { registered: false, reported: false, rejected: false }), rel = HRT.busy(ub);
      try {
        const r = await rpc('harpatka_me_unregister', Object.assign({ p_meeting: id }, imp ? { p_as: asId } : {}));
        rel();
        if (r === 'cancelled' || r === 'not_registered') { ob.done(); keepOpen = id; load(); }
        else { ob.fail(); toast(msg, r === 'attended' ? 'סומנה הגעה למפגש, אי אפשר לבטל' : 'אי אפשר לבטל את הרישום למפגש הזה', true); ub.disabled = false; delete ub.dataset.sure; ub.textContent = 'ביטול רישום'; }
      } catch (e) { rel(); ob.fail(); toast(msg, 'משהו השתבש, אפשר לנסות שוב', true); ub.disabled = false; delete ub.dataset.sure; ub.textContent = 'ביטול רישום'; }
    }; });
    /* לחיצה על התשלום בפייבוקס = דיווח על תשלום, אוטומטית (בלי קישור "שילמתי"): פייבוקס נפתח בלשונית חדשה והמפגש מסומן "ממתין לאישור" */
    app.querySelectorAll('[data-paynow]').forEach((pa) => { pa.addEventListener('click', async () => {
      const id = pa.dataset.paynow, fold = app.querySelector('[data-pf="' + id + '"]');
      if (pa.dataset.rep) return; pa.dataset.rep = '1';
      const ob = meOpt(id, { reported: true, rejected: false }, true);
      try {
        const r = await rpc('harpatka_me_report_payment', Object.assign({ p_meeting: id }, imp ? { p_as: asId } : {}));
        if (r === 'ok' || r === 'reported' || r === 'already') {
          ob.done(); keepOpen = id;
          if (fold && !window.matchMedia('(prefers-reduced-motion: reduce)').matches) { fold.classList.add('closing'); setTimeout(load, 450); } else load();   // הכפתור והקישורים נסגרים באנימציה, ואז הסטטוס מתחלף
        } else { ob.fail(); delete pa.dataset.rep; }
      } catch (e) { ob.fail(); delete pa.dataset.rep; }   // הדיווח נכשל: הכפתור נשאר, ולחיצה נוספת מנסה שוב
    }); });
    app.querySelectorAll('[data-other]').forEach((ob) => { ob.onclick = () => {
      const m = ms.find((x) => x.id === ob.dataset.other); if (!m) return;
      const info = fmtDate(m.date) + ' בשעה ' + m.time + (m.city ? ' (' + m.city + ')' : '') + (m.name ? ', ' + m.name : '');
      const text = 'היי, אני רוצה להעביר את התשלום בדרך אחרת למפגש ביום ' + info.replace(/^יום /, '');
      const wa = (num) => 'https://wa.me/' + num + '?text=' + encodeURIComponent(text);
      $('#otherInfo').textContent = info;
      $('#otherHadar').href = wa(CFG.whatsappHadar); $('#otherOfir').href = wa(CFG.whatsappOfir);
      $('#otherDlg').showModal();
    }; });
    PersonForm.bind(app);
    $('#detHead').onclick = () => { const f = $('#detBody'), on = !f.classList.contains('open'); f.classList.toggle('open', on); $('#detHead').setAttribute('aria-expanded', String(on)); };
    $('#saveBtn').onclick = async () => {
      const chk = PersonForm.validate(app); if (!chk.ok) return;
      const b = $('#saveBtn'); b.disabled = true;
      const pv = { first_name: chk.v.first, last_name: chk.v.last, age: chk.v.age, gender: chk.v.gender, phone: chk.v.phoneRaw };
      const ob = HRT.optimistic((d) => { if (d && d.participant) Object.assign(d.participant, pv); }), rel = HRT.busy(b);
      try {
        const r = await rpc('harpatka_me_update', Object.assign({ p_first: chk.v.first, p_last: chk.v.last, p_age: chk.v.age, p_gender: chk.v.gender, p_phone: chk.v.phoneRaw }, imp ? { p_as: asId } : {}));
        rel();
        if (PersonForm.serverError(app, r)) { ob.fail(); b.disabled = false; return; }
        const bad = { phone_taken: 'המספר הזה כבר רשום אצל משתתף אחר' }[r];
        if (bad) { ob.fail(); toast($('#sm'), bad, true); } else { ob.done(); toast($('#sm'), 'הפרטים נשמרו'); load(true); }
      } catch (e) { rel(); ob.fail(); toast($('#sm'), 'משהו השתבש, אפשר לנסות שוב', true); }
      b.disabled = false;
    };
  }

  const setTitle = (txt) => { const h1 = document.querySelector('.top h1'); if (h1) h1.textContent = txt || 'האזור האישי'; };
  /* טעינת המצב: תוצאה ישנה (שהסתיימה אחרי חדשה יותר) נזרקת, ושינויים שלי שעוד לא נקלטו בשרת מוחלים על כל טעינה שהתחילה לפניהם (HRT.reconcile) */
  let meSeq = 0, meApplied = 0;
  async function meFetch() {
    const my = ++meSeq, t0 = Date.now();
    const d = await rpc('harpatka_me', asId ? { p_as: asId } : {});
    if (my < meApplied) return null;
    meApplied = my; return HRT.reconcile(d, t0);
  }
  /* שינוי של המשתתף על מפגש: מוצג מיד (ציור מחדש עם שמירת המפגשים הפתוחים), נשמר מול טעינות ישנות, ומתבטל אם השרת דוחה */
  function meOpt(mid, patch, keepFold) {
    const apply = (d) => { const mm = ((d && d.meetings) || []).find((x) => x.id === mid); if (mm) Object.assign(mm, patch); };
    const h = HRT.optimistic(apply);
    if (data && data.status === 'ok' && !keepFold) { keepOpenSet = new Set([...app.querySelectorAll('.mtg.open')].map((x) => x.dataset.mid)); keepDetOpen = !!(app.querySelector('#detBody') && app.querySelector('#detBody').classList.contains('open')); keepOpen = mid; apply(data); viewMain(); }
    else if (data) apply(data);
    return { done: h.done, fail: () => { h.fail(); load(true); } };
  }
  async function load(keepMsg, afterClaim) {
    if (!data) setTitle('');
    try {
      const nd = await meFetch(); if (!nd) return; data = nd;
    } catch (e) { if (e.message === 'auth' || (asId && /HTTP (400|403|404)/.test(e.message))) { viewLogin(); return; } app.innerHTML = '<div class="center">הטעינה נכשלה. אפשר לרענן</div>'; return; }
    $('#outBtn').hidden = false;
    try { const bk = sessionStorage.getItem('harpatka_me_back'); if (bk && data && !asId) { sessionStorage.removeItem('harpatka_me_back'); const home = location.pathname.replace(/me\/?$/, ''); if (data.status === 'ok' && !data.impersonating) location.replace(home + (bk === 'reg' ? '?register=1' : '')); else if (data.status !== 'ok') location.replace(home + '?register=1'); else return; return; } } catch (e) {}   // חוזרים לדף הבית: מחוברים (עם השם בצ'יפ), או בלי רשומה לחשבון הזה: נפתח פופאפ ההרשמה   // הגיעו מהקישור "התחברות עם גוגל" בפופאפ ההרשמה: חוזרים לדף הבית והפופאפ נפתח במצב מחובר
    if (data.status === 'ok') { const keep = keepMsg ? $('#sm') && $('#sm').textContent : ''; viewMain(); if (keep) toast($('#sm'), keep); }
    else if (data.status === 'pending') viewPending();
    else if (data.status === 'blocked') viewBlocked();
    else if (afterClaim) viewSignup(lastPhone);
    else viewClaim('');
  }

  /* נרשמו עכשיו בטופס באתר: האסימון מהדפדפן מחבר את המשתתף שנוצר לחשבון הגוגל, בלי הזנת טלפון */
  async function useClaimToken() {
    let tk = null; try { tk = localStorage.getItem('harpatka_claim_token'); } catch (e) {}
    if (!tk) return;
    try { await rpc('harpatka_me_claim_token', { p_token: tk }); try { localStorage.removeItem('harpatka_claim_token'); } catch (e) {} } catch (e) { /* תקלה זמנית: האסימון נשאר לניסיון הבא */ }
  }
  async function start() {
    const q = new URLSearchParams(location.search);
    if (q.get('m')) { keepOpen = q.get('m'); scrollTo = q.get('m'); try { history.replaceState(null, '', location.pathname); } catch (e) {} }   // מדף הבית: פתיחת המפגש שנבחר וגלילה אליו
    try { asId = q.get('as') || sessionStorage.getItem(AS_KEY) || null; sessionStorage.removeItem(AS_KEY); } catch (e) { asId = q.get('as'); }
    const h = new URLSearchParams(location.hash.replace(/^#/, ''));
    if (h.get('access_token')) { saveSession({ access_token: h.get('access_token'), refresh_token: h.get('refresh_token') }); history.replaceState(null, '', location.pathname + (asId ? '?as=' + encodeURIComponent(asId) : '')); }
    else if (h.get('error_description')) { history.replaceState(null, '', location.pathname); }
    else { try { session = JSON.parse(localStorage.getItem(SKEY) || 'null'); } catch (e) { session = null; } }
    if (asId) {   // התחזות: החיבור של דף הניהול קודם (גם כשבדפדפן יש חיבור של משתתף), כך שמנהל שכבר מחובר לדף הניהול נכנס בלי כניסה נוספת
      try { const a = JSON.parse(localStorage.getItem(AKEY) || 'null'); if (a && a.access_token) { usingAdmin = true; session = a; } } catch (e) {}
    }
    if (session && !sessionOk(session) && !(await refreshSession())) clearSession();
    if (h.get('access_token') && window.opener && localStorage.getItem('harpatka_login_popup')) {   // חלון כניסה קופץ מדף אחר: מסמנים שהחיבור נשמר וסוגרים
      try { localStorage.removeItem('harpatka_login_popup'); localStorage.setItem('harpatka_login_done', String(Date.now())); } catch (e) {}
      window.close(); return;
    }
    if (session && !asId) await useClaimToken();
    if (!session) { if (q.get('login') && !asId) { if (q.get('back')) { try { sessionStorage.setItem('harpatka_me_back', q.get('back')); } catch (e) {} } goGoogle(); return; } viewLogin(); return; }   // ?login=1 (הקישור מההרשמה): ישר להתחברות עם גוגל, בלי מסך ביניים
    load();
  }
  $('#outBtn').onclick = () => { if (EMBED) { if (!asId) clearSession(); try { window.parent.postMessage({ harpatka: 'me-logout' }, location.origin); } catch (e) {} return; } if (!usingAdmin) clearSession(); else { try { sessionStorage.removeItem(AS_KEY); } catch (e) {} } location.href = location.pathname; };
  /* זמן אמת: אות ריק בערוץ ציבורי "me" (בבדיקות "me-test") בכל שינוי בתשלומים, בשיוכים, במפגשים ובפרטי משתתפים (admin/realtime-all.sql); HRT.channel מטפל בחיבור מחדש, חזרה ללשונית וגיבוי כל 45 שניות.
     הרענון לא קורה בזמן הקלדה (נדחה עד עזיבת השדה), ושומר אילו מפגשים פתוחים */
  let rtT = 0, rtDirty = false;
  const typingNow = () => { const el = document.activeElement; return !!(el && /^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName) && app.contains(el)); };
  const refreshNow = () => {
    if (!data || data.status !== 'ok' || document.querySelector('dialog[open]')) return;
    if (typingNow()) { rtDirty = true; return; }
    rtDirty = false;
    keepOpenSet = new Set([...app.querySelectorAll('.mtg.open')].map((x) => x.dataset.mid));
    keepDetOpen = !!(app.querySelector('#detBody') && app.querySelector('#detBody').classList.contains('open'));
    load(true);
  };
  const scheduleRefresh = () => { clearTimeout(rtT); rtT = setTimeout(refreshNow, 250); };
  document.addEventListener('focusout', () => { if (rtDirty) setTimeout(refreshNow, 300); });
  HRT.channel({ url: DB.url, key: DB.key }, (window.HARPATKA_ENV && window.HARPATKA_ENV.name === 'test') ? 'me-test' : 'me', scheduleRefresh, { poll: 45000 });
  $('#otherClose').onclick = () => $('#otherDlg').close();
  $('#otherDlg').addEventListener('click', (e) => { if (e.target === $('#otherDlg')) $('#otherDlg').close(); });
  start();
})();
</script>
</body>
</html>
